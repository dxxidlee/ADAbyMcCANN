<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Multi-export — McCann Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="assets/design.css">
<style>
/* Multi-export — Figma 95:90 on suite 5×5 grid (cells on .layout) */
.mx{
  --mx-fs:var(--suite-fs);
  --mx-track:-1px;
  --mx-label:#969696;
  --mx-chip:#757575;
  --mx-fill:#F4F4F4;
  --mx-radius:5px;
  --mx-drop-radius:10px;
  --mx-drop-stroke:2px solid var(--mx-fill);
  display:contents;
}

.mx__title,
.mx__band,
.mx__desc,
.mx__stage,
.mx__drop{
  font-family:var(--sans);
  font-size:var(--mx-fs);
  font-weight:400;
  letter-spacing:var(--mx-track);
  line-height:1.2;
  color:#000;
}

/* Suite rows: 1=menu · 2=title/controls · 3–5=drop */
.mx__title{
  grid-column:1;
  grid-row:2;
  margin:0;
  padding:0;
  font-family:var(--sans);
  font-size:var(--mx-fs);
  font-weight:400;
  letter-spacing:var(--mx-track);
  line-height:1.2;
  color:#000000;
  white-space:nowrap;
  align-self:start;
  z-index:2;
}

.mx__band{
  grid-column:2 / -1;
  grid-row:2;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
  align-self:start;
  z-index:2;
}

.mx__desc{
  margin:0;
  padding:0;
  font-size:var(--mx-fs);
  font-weight:400;
  letter-spacing:var(--mx-track);
  line-height:1.2;
  color:var(--mx-label);
  flex:0 0 auto;
}

/* Shared two-row track so Color-space chips ↔ Raster size share one baseline */
.mx__controls{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  grid-template-rows:auto auto;
  column-gap:var(--suite-gutter);
  row-gap:15px;
  align-items:start;
  flex:0 0 auto;
  min-height:0;
}

.mx__group{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}
.mx__group--formats{ grid-column:1; grid-row:1; }
.mx__group--space{ grid-column:1; grid-row:2; }
.mx__group--treat{ grid-column:2; grid-row:1; }
.mx__group--raster{ grid-column:2; grid-row:2; }
.mx__group--export{ grid-column:3; grid-row:1 / -1; }

.mx__label{
  margin:0;
  color:var(--mx-label);
  font:inherit;
  letter-spacing:inherit;
  line-height:1.2;
}

.mx__pills{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:34px;
}

.mx__pill{
  appearance:none;
  border:0;
  margin:0;
  padding:5px 10px;
  height:34px;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font:inherit;
  letter-spacing:inherit;
  line-height:1;
  color:var(--mx-chip);
  background:transparent;
  border-radius:var(--mx-radius);
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.mx__pill:hover{ color:#000; }
.mx__pill.is-active{
  background:var(--mx-fill);
  color:var(--mx-chip);
}
.mx__pill.is-active:hover{ color:#000; }
.mx__pill:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.mx__size{
  display:flex;
  align-items:center;
  gap:0;
  color:var(--mx-chip);
  flex-wrap:wrap;
  min-height:34px; /* match chip row → aligns with cmyk */
  box-sizing:border-box;
}
.mx__size input{
  font:inherit;
  letter-spacing:inherit;
  color:var(--mx-chip);
  background:transparent;
  border:0;
  border-bottom:1px solid var(--mx-chip);
  outline:none;
  width:3.2em;
  padding:0;
  text-align:left;
  -moz-appearance:textfield;
}
.mx__size input::-webkit-outer-spin-button,
.mx__size input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.mx__size input:focus{ color:#000; border-bottom-color:#000; }
.mx__size-unit{ color:var(--mx-chip); }

.mx__status{
  margin:0;
  color:var(--mx-label);
  min-height:2.4em;
}

/* Stage: Source logo + drop across suite cols 2–5, rows 3–5 */
.mx__stage{
  grid-column:2 / -1;
  grid-row:3 / -1;
  display:flex;
  flex-direction:column;
  gap:var(--suite-gutter);
  min-width:0;
  min-height:0;
  align-self:stretch;
  justify-self:stretch;
  z-index:1;
}

.mx__source-head{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  column-gap:var(--suite-gutter);
  align-items:center;
  flex:0 0 auto;
  min-width:0;
  /* Reserve chip-row height so the drop zone never resizes when tags appear */
  min-height:34px;
}
.mx__source-head .mx__label{
  grid-column:1;
  align-self:center;
}
.mx__meta{
  grid-column:2 / -1;
  display:none;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-width:0;
}
.mx__meta.is-on{ display:flex; }

.mx__tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:34px;
  padding:5px 10px;
  box-sizing:border-box;
  background:var(--mx-fill);
  border-radius:var(--mx-radius);
  color:var(--mx-chip);
  font:inherit;
  letter-spacing:inherit;
  line-height:1;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:0;
  transform:translateY(6px);
  will-change:opacity, transform;
}
.mx__meta.is-on .mx__tag{
  animation:mxTagIn 520ms var(--ease) forwards;
}
.mx__meta.is-on .mx__tag:nth-child(1){ animation-delay:60ms; }
.mx__meta.is-on .mx__tag:nth-child(2){ animation-delay:180ms; }
.mx__meta.is-on .mx__tag:nth-child(3){ animation-delay:300ms; }

@keyframes mxTagIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion:reduce){
  .mx__tag{
    opacity:1;
    transform:none;
    will-change:auto;
  }
  .mx__meta.is-on .mx__tag{
    animation:none;
  }
}

/* Drop: stroke only, no fill — Figma 112:280 */
.mx__drop{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  background:transparent;
  border:var(--mx-drop-stroke);
  border-radius:var(--mx-drop-radius);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s var(--ease);
  overflow:hidden;
}
.mx__drop:hover{ border-color:#e4e4e4; }
.mx__drop.is-drag{ border-color:#cfcfcf; }
.mx__drop-hint{
  margin:0;
  color:var(--mx-chip);
  font:inherit;
  letter-spacing:inherit;
  pointer-events:none;
}
.mx__drop.has .mx__drop-hint{ display:none; }
.mx__drop .mx__preview{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  box-sizing:border-box;
}
.mx__drop .mx__preview img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.canvas-stash{
  position:fixed;
  left:-9999px;
  top:0;
  width:0;
  height:0;
  overflow:hidden;
  pointer-events:none;
}

/* Remove broken @supports fallback that fought the suite grid */
</style>
</head>
<body>

<div class="mx">
  <h1 class="mx__title">Multi-export</h1>

  <div class="mx__band">
    <p class="mx__desc">This tool allows the user to export a design to multiple formats and sizes at once.</p>

    <div class="mx__controls">
      <div class="mx__group mx__group--formats">
        <div class="mx__label">File formats</div>
        <div class="mx__pills" id="fmtOpts">
          <button type="button" class="mx__pill" data-fmt="png" aria-pressed="false">.png</button>
          <button type="button" class="mx__pill" data-fmt="jpg" aria-pressed="false">.jpg</button>
          <button type="button" class="mx__pill" data-fmt="svg" aria-pressed="false">.svg</button>
          <button type="button" class="mx__pill" data-fmt="eps" aria-pressed="false">.eps</button>
        </div>
      </div>
      <div class="mx__group mx__group--space">
        <div class="mx__label">Color space</div>
        <div class="mx__pills" id="spaceOpts">
          <button type="button" class="mx__pill is-active" data-space="rgb" aria-pressed="true">rgb</button>
          <button type="button" class="mx__pill is-active" data-space="cmyk" aria-pressed="true">cmyk</button>
        </div>
      </div>

      <div class="mx__group mx__group--treat">
        <div class="mx__label">Treatment</div>
        <div class="mx__pills" id="treatOpts">
          <button type="button" class="mx__pill is-active" data-treat="color" aria-pressed="true">Color</button>
          <button type="button" class="mx__pill is-active" data-treat="grayscale" aria-pressed="true">Grayscale</button>
        </div>
      </div>
      <div class="mx__group mx__group--raster">
        <div class="mx__label">Raster size</div>
        <div class="mx__size">
          <input type="number" id="size" value="2000" min="64" max="6000" step="1" aria-label="Raster size in pixels">
          <span class="mx__size-unit">&nbsp;px longest edge</span>
        </div>
      </div>

      <div class="mx__group mx__group--export">
        <div class="mx__label">Export</div>
        <div class="mx__pills">
          <button type="button" class="mx__pill is-active" id="runBtn" disabled>.zip</button>
        </div>
        <p class="mx__status" id="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div class="mx__stage">
    <div class="mx__source-head">
      <p class="mx__label">Source logo</p>
      <div class="mx__meta" id="meta" aria-live="polite">
        <span class="mx__tag" id="metaName"></span>
        <span class="mx__tag" id="metaDims"></span>
        <span class="mx__tag" id="metaBytes"></span>
      </div>
    </div>
    <div class="mx__drop" id="drop" role="button" tabindex="0" aria-label="Drop a file here">
      <p class="mx__drop-hint">Drop the file here (.png, .jpg, .svg)</p>
    </div>
  </div>
</div>

<input type="file" id="file" accept=".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml" hidden>
<div class="canvas-stash" id="stash"></div>
<script src="assets/nav.js"></script>

<script>
let uploaded=null; // {name, type, dataUrl, isSvg, svgText, img}

const drop=document.getElementById("drop");
const fileInput=document.getElementById("file");
const runBtn=document.getElementById("runBtn");
const statusEl=document.getElementById("status");
const metaEl=document.getElementById("meta");
const metaName=document.getElementById("metaName");
const metaDims=document.getElementById("metaDims");
const metaBytes=document.getElementById("metaBytes");

function formatBytes(n){
  if(!Number.isFinite(n) || n < 0) return "—";
  if(n < 1024) return n + " B";
  const kb = n / 1024;
  if(kb < 1024) return (kb < 10 ? kb.toFixed(1) : Math.round(kb)) + " KB";
  const mb = kb / 1024;
  return (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + " MB";
}

function clearMeta(){
  metaEl.classList.remove("is-on");
  metaName.textContent="";
  metaDims.textContent="";
  metaBytes.textContent="";
}

function showMeta(fileName, w, h, bytes){
  metaEl.classList.remove("is-on");
  metaName.textContent=fileName;
  metaName.title=fileName;
  metaDims.textContent=w + "x" + h;
  metaBytes.textContent=formatBytes(bytes);
  void metaEl.offsetWidth; /* restart stagger on replace */
  metaEl.classList.add("is-on");
}

/* ---------- Upload ---------- */
drop.addEventListener("click",()=>fileInput.click());
drop.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); }
});
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("is-drag");});
drop.addEventListener("dragleave",()=>drop.classList.remove("is-drag"));
drop.addEventListener("drop",e=>{
  e.preventDefault(); drop.classList.remove("is-drag");
  if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change",e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });

function reset(){
  uploaded=null; fileInput.value="";
  drop.classList.remove("has");
  drop.innerHTML='<p class="mx__drop-hint">Drop the file here (.png, .jpg, .svg)</p>';
  runBtn.disabled=true;
  statusEl.textContent="";
  clearMeta();
}

function handleFile(f){
  const isSvg = f.type==="image/svg+xml" || f.name.toLowerCase().endsWith(".svg");
  const reader=new FileReader();
  reader.onload=()=>{
    const result=reader.result;
    const obj={
      name:f.name.replace(/\.[^.]+$/,"")||"logo",
      fileName:f.name,
      fileSize:f.size,
      type:f.type,
      isSvg,
      svgText:null,
      dataUrl:null,
      img:null
    };
    if(isSvg){
      obj.svgText = (typeof result==="string" && result.indexOf("<svg")>=0) ? result : null;
      obj.dataUrl = "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(obj.svgText||"")));
    } else {
      obj.dataUrl = result;
    }
    const img=new Image();
    img.onload=()=>{
      obj.img=img;
      uploaded=obj;
      showPreview();
      showMeta(obj.fileName, img.naturalWidth||img.width, img.naturalHeight||img.height, obj.fileSize);
      runBtn.disabled=false;
      statusEl.textContent="";
    };
    img.onerror=()=>{ statusEl.textContent="Could not read that image. Try a PNG, JPG, or SVG."; };
    img.src=obj.dataUrl;
  };
  if(isSvg) reader.readAsText(f); else reader.readAsDataURL(f);
}

function showPreview(){
  drop.classList.add("has");
  drop.innerHTML='<div class="mx__preview"><img src="'+uploaded.dataUrl+'" alt="Preview"></div>';
}

/* ---------- Options ---------- */
function opts(){
  const get=(attr)=>[...document.querySelectorAll('.mx__pill.is-active[data-'+attr+']')].map(c=>c.dataset[attr]);
  return {
    fmts:get("fmt"),
    spaces:get("space"),
    treats:get("treat"),
    size:Math.max(64,Math.min(6000,parseInt(document.getElementById("size").value)||2000))
  };
}

document.querySelectorAll("#fmtOpts .mx__pill, #spaceOpts .mx__pill, #treatOpts .mx__pill").forEach(b=>{
  b.addEventListener("click",()=>{
    b.classList.toggle("is-active");
    b.setAttribute("aria-pressed", b.classList.contains("is-active"));
  });
});

/* ---------- Raster helpers ---------- */
function drawToCanvas(img, size, {gray=false, matte=null}={}){
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  const scale=size/Math.max(w,h);
  const cw=Math.round(w*scale), ch=Math.round(h*scale);
  const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  const x=cv.getContext("2d");
  if(matte){ x.fillStyle=matte; x.fillRect(0,0,cw,ch); }
  x.drawImage(img,0,0,cw,ch);
  if(gray){
    const id=x.getImageData(0,0,cw,ch); const d=id.data;
    for(let i=0;i<d.length;i+=4){
      const l=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
      d[i]=d[i+1]=d[i+2]=l;
    }
    x.putImageData(id,0,0);
  }
  return cv;
}
function canvasBlob(cv,type,q){ return new Promise(res=>cv.toBlob(res,type,q)); }

/* ---------- SVG helpers ---------- */
function svgGrayWrap(innerSvgOrImg, isVector, dataUrl, w, h){
  const filter='<filter id="g"><feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/></filter>';
  if(isVector && innerSvgOrImg){
    let s=innerSvgOrImg;
    if(/<svg[^>]*>/i.test(s)){
      s=s.replace(/<svg([^>]*)>/i,'<svg$1><defs>'+filter+'</defs><g filter="url(#g)">');
      s=s.replace(/<\/svg>\s*$/i,'</g></svg>');
    }
    return s;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${filter}</defs><image filter="url(#g)" width="${w}" height="${h}" href="${dataUrl}"/></svg>`;
}
function svgColorWrap(isVector, svgText, dataUrl, w, h){
  if(isVector && svgText) return svgText;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><image width="${w}" height="${h}" href="${dataUrl}"/></svg>`;
}

/* ---------- EPS generation ---------- */
function parseColorToPS(col, fallback){
  if(col==null || col==="none" || col==="transparent") {
    return fallback===undefined ? null : fallback;
  }
  col=String(col).trim();
  if(col==="currentColor") col="#000";
  let m=col.match(/^#([0-9a-f]{3})$/i);
  if(m){ const s=m[1]; return [parseInt(s[0]+s[0],16)/255,parseInt(s[1]+s[1],16)/255,parseInt(s[2]+s[2],16)/255]; }
  m=col.match(/^#([0-9a-f]{6})$/i);
  if(m){ const s=m[1]; return [parseInt(s.slice(0,2),16)/255,parseInt(s.slice(2,4),16)/255,parseInt(s.slice(4,6),16)/255]; }
  m=col.match(/^rgba?\(([^)]+)\)$/i);
  if(m){ const p=m[1].split(",").map(s=>parseFloat(s)); return [(p[0]||0)/255,(p[1]||0)/255,(p[2]||0)/255]; }
  try{ const c=document.createElement("canvas"); c.width=c.height=1; const x=c.getContext("2d");
    x.fillStyle="#000"; x.fillStyle=col; x.fillRect(0,0,1,1);
    const d=x.getImageData(0,0,1,1).data; return [d[0]/255,d[1]/255,d[2]/255];
  }catch(e){ return fallback===undefined?null:fallback; }
}
function toGrayPS(rgb){ if(!rgb) return null; const l=0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2]; return [l,l,l]; }
function rgbToCmyk(rgb){
  if(!rgb) return null;
  const r=rgb[0],g=rgb[1],b=rgb[2];
  const k=1-Math.max(r,g,b);
  if(k>=1) return [0,0,0,1];
  const c=(1-r-k)/(1-k), m=(1-g-k)/(1-k), y=(1-b-k)/(1-k);
  return [c,m,y,k];
}
function ps(n){ return (Math.round(n*1000)/1000); }

function pathDataToPS(d){
  const tokens=d.match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
  if(!tokens) return "";
  let i=0, cmd="", out="";
  let cx=0, cy=0, sx=0, sy=0, px=0, py=0, prevCmd="";
  const num=()=>parseFloat(tokens[i++]);
  const isCmd=t=>/^[a-zA-Z]$/.test(t);
  while(i<tokens.length){
    if(isCmd(tokens[i])){ cmd=tokens[i++]; }
    const abs=cmd===cmd.toUpperCase(); const C=cmd.toUpperCase();
    if(C==="M"){
      let x=num(), y=num(); if(!abs){x+=cx;y+=cy;}
      cx=x;cy=y;sx=x;sy=y; out+=`${ps(x)} ${ps(y)} moveto\n`;
      cmd = abs ? "L" : "l";
    } else if(C==="L"){
      let x=num(), y=num(); if(!abs){x+=cx;y+=cy;} cx=x;cy=y; out+=`${ps(x)} ${ps(y)} lineto\n`;
    } else if(C==="H"){
      let x=num(); if(!abs)x+=cx; cx=x; out+=`${ps(x)} ${ps(cy)} lineto\n`;
    } else if(C==="V"){
      let y=num(); if(!abs)y+=cy; cy=y; out+=`${ps(cx)} ${ps(y)} lineto\n`;
    } else if(C==="C"){
      let x1=num(),y1=num(),x2=num(),y2=num(),x=num(),y=num();
      if(!abs){x1+=cx;y1+=cy;x2+=cx;y2+=cy;x+=cx;y+=cy;}
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=x2;py=y2;cx=x;cy=y;
    } else if(C==="S"){
      let x2=num(),y2=num(),x=num(),y=num();
      if(!abs){x2+=cx;y2+=cy;x+=cx;y+=cy;}
      let x1=cx,y1=cy; if(prevCmd && "CS".includes(prevCmd.toUpperCase())){ x1=2*cx-px; y1=2*cy-py; }
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=x2;py=y2;cx=x;cy=y;
    } else if(C==="Q"){
      let qx=num(),qy=num(),x=num(),y=num();
      if(!abs){qx+=cx;qy+=cy;x+=cx;y+=cy;}
      const x1=cx+2/3*(qx-cx), y1=cy+2/3*(qy-cy), x2=x+2/3*(qx-x), y2=y+2/3*(qy-y);
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=qx;py=qy;cx=x;cy=y;
    } else if(C==="T"){
      let x=num(),y=num(); if(!abs){x+=cx;y+=cy;}
      let qx=cx,qy=cy; if(prevCmd && "QT".includes(prevCmd.toUpperCase())){ qx=2*cx-px; qy=2*cy-py; }
      const x1=cx+2/3*(qx-cx), y1=cy+2/3*(qy-cy), x2=x+2/3*(qx-x), y2=y+2/3*(qy-y);
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=qx;py=qy;cx=x;cy=y;
    } else if(C==="A"){
      let rx=num(),ry=num(),rot=num(),laf=num(),sf=num(),x=num(),y=num();
      if(!abs){x+=cx;y+=cy;} cx=x;cy=y; out+=`${ps(x)} ${ps(y)} lineto\n`;
    } else if(C==="Z"){
      out+=`closepath\n`; cx=sx;cy=sy;
    } else { i++; }
    prevCmd=cmd;
  }
  return out;
}

function shapeToPathD(el){
  const tag=el.tagName.toLowerCase();
  const n=a=>parseFloat(el.getAttribute(a)||0);
  if(tag==="rect"){
    const x=n("x"),y=n("y"),w=n("width"),h=n("height");
    return `M${x} ${y} H${x+w} V${y+h} H${x} Z`;
  }
  if(tag==="line"){ return `M${n("x1")} ${n("y1")} L${n("x2")} ${n("y2")}`; }
  if(tag==="polyline"||tag==="polygon"){
    const pts=(el.getAttribute("points")||"").trim().split(/[\s,]+/).map(Number);
    let d=""; for(let i=0;i<pts.length;i+=2){ d+=(i===0?"M":"L")+pts[i]+" "+pts[i+1]+" "; }
    if(tag==="polygon") d+="Z"; return d;
  }
  if(tag==="circle"){
    const cx=n("cx"),cy=n("cy"),r=n("r"); const k=0.5522847498*r;
    return `M${cx-r} ${cy} C${cx-r} ${cy-k} ${cx-k} ${cy-r} ${cx} ${cy-r} C${cx+k} ${cy-r} ${cx+r} ${cy-k} ${cx+r} ${cy} C${cx+r} ${cy+k} ${cx+k} ${cy+r} ${cx} ${cy+r} C${cx-k} ${cy+r} ${cx-r} ${cy+k} ${cx-r} ${cy} Z`;
  }
  if(tag==="ellipse"){
    const cx=n("cx"),cy=n("cy"),rx=n("rx"),ry=n("ry"); const kx=0.5522847498*rx,ky=0.5522847498*ry;
    return `M${cx-rx} ${cy} C${cx-rx} ${cy-ky} ${cx-kx} ${cy-ry} ${cx} ${cy-ry} C${cx+kx} ${cy-ry} ${cx+rx} ${cy-ky} ${cx+rx} ${cy} C${cx+rx} ${cy+ky} ${cx+kx} ${cy+ry} ${cx} ${cy+ry} C${cx-kx} ${cy+ry} ${cx-rx} ${cy+ky} ${cx-rx} ${cy} Z`;
  }
  if(tag==="path"){ return el.getAttribute("d")||""; }
  return "";
}

function epsFromSvg(svgText, {gray=false, cmyk=false}={}){
  const doc=new DOMParser().parseFromString(svgText,"image/svg+xml");
  const svg=doc.querySelector("svg");
  if(!svg) return null;
  let vb=(svg.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number);
  let W,H,minX=0,minY=0;
  if(vb.length===4){ minX=vb[0];minY=vb[1];W=vb[2];H=vb[3]; }
  else { W=parseFloat(svg.getAttribute("width"))||300; H=parseFloat(svg.getAttribute("height"))||150; }

  const shapeEls=svg.querySelectorAll("path,rect,circle,ellipse,line,polyline,polygon");
  let body="";
  shapeEls.forEach(el=>{
    const d=shapeToPathD(el); if(!d) return;
    const psPath=pathDataToPS(d); if(!psPath.trim()) return;
    const styleFill=(el.getAttribute("style")||"").match(/fill\s*:\s*([^;]+)/i);
    const fillRaw = (el.getAttribute("fill")) || (styleFill&&styleFill[1]) || "#000";
    let fill=parseColorToPS(fillRaw, [0,0,0]);
    const styleStroke=(el.getAttribute("style")||"").match(/stroke\s*:\s*([^;]+)/i);
    const strokeRaw=(el.getAttribute("stroke"))||(styleStroke&&styleStroke[1])||null;
    let stroke=parseColorToPS(strokeRaw);
    const sw=parseFloat(el.getAttribute("stroke-width")|| (el.getAttribute("style")||"").match(/stroke-width\s*:\s*([\d.]+)/i)?.[1] ||1);
    if(gray){ fill=toGrayPS(fill); stroke=toGrayPS(stroke); }
    const colorOp=(rgb)=>{
      if(cmyk){ const c=rgbToCmyk(rgb); return `${ps(c[0])} ${ps(c[1])} ${ps(c[2])} ${ps(c[3])} setcmykcolor`; }
      return `${ps(rgb[0])} ${ps(rgb[1])} ${ps(rgb[2])} setrgbcolor`;
    };
    if(fill){
      body+=`${colorOp(fill)}\n${psPath}fill\n`;
    }
    if(stroke){
      body+=`${colorOp(stroke)}\n${ps(sw)} setlinewidth\n${psPath}stroke\n`;
    }
  });

  const eps=`%!PS-Adobe-3.0 EPSF-3.0
%%Creator: McCANN Export (vector)
%%Title: ${cmyk?"vector EPS — CMYK (uncalibrated, see README)":"vector EPS — RGB"}
%%BoundingBox: 0 0 ${Math.ceil(W)} ${Math.ceil(H)}
%%LanguageLevel: 2
%%DocumentProcessColors: ${cmyk?"Cyan Magenta Yellow Black":"(RGB)"}
%%EndComments
gsave
0 ${ps(H)} translate
1 -1 scale
${ps(-minX)} ${ps(-minY)} translate
1 setlinejoin
1 setlinecap
${body}grestore
showpage
%%EOF`;
  return new Blob([eps],{type:"application/postscript"});
}

function epsFromCanvas(cv, cmyk){
  const MAX=600;
  let src=cv;
  if(Math.max(cv.width,cv.height)>MAX){
    const s=MAX/Math.max(cv.width,cv.height);
    const tmp=document.createElement("canvas");
    tmp.width=Math.round(cv.width*s); tmp.height=Math.round(cv.height*s);
    tmp.getContext("2d").drawImage(cv,0,0,tmp.width,tmp.height);
    src=tmp;
  }
  const w=src.width,h=src.height;
  const data=src.getContext("2d").getImageData(0,0,w,h).data;
  let hex="";
  for(let i=0;i<data.length;i+=4){
    hex+=data[i].toString(16).padStart(2,"0")+data[i+1].toString(16).padStart(2,"0")+data[i+2].toString(16).padStart(2,"0");
  }
  const head=`%!PS-Adobe-3.0 EPSF-3.0
%%Creator: McCANN Export (embedded raster)
%%Title: raster EPS${cmyk?" (CMYK intent — see README)":""}
%%BoundingBox: 0 0 ${w} ${h}
%%LanguageLevel: 2
%%EndComments
gsave
${w} ${h} scale
${w} ${h} 8 [${w} 0 0 -${h} 0 ${h}]
{<${hex}>} false 3 colorimage
grestore
showpage
%%EOF`;
  return new Blob([head],{type:"application/postscript"});
}

/* ---------- Generate ZIP ---------- */
runBtn.addEventListener("click",generate);

async function generate(){
  if(!uploaded) return;
  const {fmts,spaces,treats,size}=opts();
  if(!fmts.length||!spaces.length||!treats.length){
    statusEl.textContent="Pick at least one format, color space, and treatment.";
    return;
  }
  runBtn.disabled=true;
  statusEl.textContent="Rendering…";

  try{
    const zip=new JSZip();
    const base=uploaded.name;
    const root=zip.folder(base+"-Exports");
    const img=uploaded.img;
    const spaceLabel={rgb:"RGB",cmyk:"CMYK"}, treatLabel={color:"COLOR",grayscale:"GRAYSCALE"};

    let count=0;
    for(const sp of spaces){
      const cmyk = sp==="cmyk";
      for(const tr of treats){
        const gray = tr==="grayscale";
        const dir=root.folder(spaceLabel[sp]).folder(treatLabel[tr]);
        const stem=base+"-"+spaceLabel[sp].toLowerCase()+"-"+treatLabel[tr].toLowerCase();

        const cvPng=drawToCanvas(img,size,{gray});
        const cvJpg=drawToCanvas(img,size,{gray,matte:"#ffffff"});

        for(const fm of fmts){
          if(fm==="png"){ dir.file(stem+".png", await canvasBlob(cvPng,"image/png")); }
          else if(fm==="jpg"){ dir.file(stem+".jpg", await canvasBlob(cvJpg,"image/jpeg",0.92)); }
          else if(fm==="svg"){
            const w=cvPng.width,h=cvPng.height;
            const pngUrl=cvPng.toDataURL("image/png");
            const svg = gray
              ? svgGrayWrap(uploaded.svgText, uploaded.isSvg, pngUrl, w, h)
              : svgColorWrap(uploaded.isSvg, uploaded.svgText, pngUrl, w, h);
            dir.file(stem+".svg", svg);
          }
          else if(fm==="eps"){
            let epsBlob=null;
            if(uploaded.isSvg && uploaded.svgText){
              epsBlob=epsFromSvg(uploaded.svgText,{gray,cmyk});
            }
            if(!epsBlob){ epsBlob=epsFromCanvas(cvJpg, cmyk); }
            dir.file(stem+".eps", epsBlob);
          }
          count++;
        }
      }
    }

    root.file("README.txt", readmeText(base));
    statusEl.textContent="Packaging…";
    const blob=await zip.generateAsync({type:"blob"},meta=>{
      statusEl.textContent="Packaging… "+Math.round(meta.percent)+"%";
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=base+"-Exports.zip"; a.click();
    const folders=spaces.length*treats.length;
    statusEl.innerHTML="Export completed,<br>"+count+" files across "+folders+" folders.";
  }catch(err){
    console.error(err);
    statusEl.textContent="Something went wrong while generating.";
  }finally{
    runBtn.disabled=false;
  }
}

function readmeText(base){
  return `${base} — Export package
Generated by the McCANN Export tool (prototype)

FOLDER STRUCTURE
  ${base}-Exports/
    RGB/ and CMYK/      -> color space
      COLOR/ GRAYSCALE/ -> treatment
        .png .jpg .svg .eps -> formats

WHAT IS REAL
  PNG   Real raster, transparent background.
  JPG   Real raster, flattened on white.
  SVG   Vector if you uploaded an SVG; otherwise the raster is embedded
        inside an SVG wrapper. Grayscale uses an SVG color-matrix filter.
  EPS   If you uploaded an SVG, the EPS is TRUE VECTOR — the shapes are
        converted to PostScript paths (moveto/lineto/curveto) and open as
        editable vector art in Illustrator. If you uploaded a PNG/JPG, the
        EPS embeds the bitmap instead (a photo can't be vectorized without
        tracing). For best EPS results, upload vector SVG.
  GRAYSCALE  Real luminance conversion (Rec. 709 weights).

IMPORTANT LIMITS (please read)
  CMYK  EPS (from an SVG upload) writes true four-channel ink values via the
        PostScript setcmykcolor operator, but from a standard uncalibrated
        formula — NOT an ICC press profile. Always soft-proof in Illustrator
        against your actual profile (SWOP, GRACoL, Fogra39) before output.
        PNG / JPG / SVG / raster EPS stay RGB — convert rasters in
        Photoshop/Illustrator against your print profile.

Treat this package as a fast first pass for screen and layout use. Anything
going to press should be finalized in Adobe tools against the right profile.`;
}
