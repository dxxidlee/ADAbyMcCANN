<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export — McCANN Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#000; --paper:#fff; --muted:#000; --line:#000;
    --sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    --display:'McCann Headline','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  @font-face{
    font-family:'McCann Headline';
    src:url('McCann-Headline_4.ttf') format('truetype');
    font-weight:100 900; font-display:swap;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18pt;font-weight:400;line-height:1.05;-webkit-font-smoothing:antialiased;}
  ::selection{background:#000;color:#fff;}
  a{color:inherit;text-decoration:none;}

  .wrap{margin:0;padding:30px 20px 80px;}
  .home-mark{display:block;width:50px;height:26px;line-height:0;margin-bottom:0;}
  .home-mark svg{display:block;width:100%;height:auto;}

  /* Slide-down nav overlay */
  .navOverlay{position:fixed;inset:0;z-index:1000;background:var(--paper);transform:translateY(-100%);transition:transform .55s cubic-bezier(.16,1,.3,1);will-change:transform;box-shadow:0 24px 60px rgba(0,0,0,0);pointer-events:none;}
  .navOverlay.open{transform:translateY(0);box-shadow:0 24px 60px rgba(0,0,0,.18);pointer-events:auto;}
  .navOverlay .navFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
  .navOverlay .navClose{position:absolute;top:30px;left:20px;z-index:2;width:50px;height:26px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;}

  .cols{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.2fr);gap:48px;align-items:stretch;margin-top:56px;}
  @media(max-width:760px){.cols{grid-template-columns:1fr;gap:36px;}}
  .uploadCol{display:flex;flex-direction:column;}

  label.lbl{font-weight:400;color:var(--ink);display:block;margin-bottom:8px;}

  /* dropzone */
  .drop{border:1px solid var(--ink);flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;cursor:pointer;transition:background .15s;gap:10px;}
  .drop.drag{background:#fafafa;}
  .drop .big{font-weight:400;}
  .drop.has{padding:0;border-style:solid;}
  .preview{width:100%;flex:1;min-height:280px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f4f4f2 0% 25%,#fff 0% 50%) 50%/20px 20px;}
  .preview img{max-width:86%;max-height:86%;object-fit:contain;}
  .filemeta{margin-top:12px;display:flex;justify-content:space-between;gap:18px;}
  .filemeta button{font-family:var(--sans);border:none;background:transparent;color:var(--ink);cursor:pointer;padding:0;text-decoration:none;}
  .filemeta button:hover{text-decoration:underline;}

  /* options */
  .optblock{margin-bottom:28px;}
  .checks{display:flex;flex-direction:column;gap:8px;}
  .chk{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
  .chk input{appearance:none;width:18px;height:18px;border:1px solid var(--ink);background:#fff;cursor:pointer;position:relative;flex:none;}
  .chk input:checked{background:#000;}

  .sizefield{display:flex;align-items:center;gap:12px;}
  .sizefield input{font-family:var(--sans);border:none;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);width:110px;padding:4px 0;outline:none;}

  .run{margin-top:8px;}
  .run button{font-family:var(--sans);border:none;background:transparent;color:var(--ink);padding:0;cursor:pointer;letter-spacing:0;text-decoration:none;}
  .run button:hover{text-decoration:underline;}
  .run button:disabled{opacity:.35;cursor:not-allowed;text-decoration:none;}
  .status{margin-top:14px;min-height:16px;}

  .canvas-stash{position:absolute;left:-9999px;top:-9999px;}

  /* Swiss type system — one size, one weight, hard left, no gray */
  body, label.lbl, .drop .big, .drop .small, .filemeta, .filemeta button, .chk,
  .sizefield input, .sizefield .note, .run button, .status {
    font-family: var(--sans);
    font-size: 18pt;
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.05;
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" id="navOpen" class="home-mark" aria-label="Open McCANN Design Suite">
    <svg width="50" height="26" viewBox="0 0 50 26" fill="none" aria-hidden="true">
      <line y1="5" x2="50" y2="5" stroke="black" stroke-width="10"/>
      <line y1="21" x2="50" y2="21" stroke="black" stroke-width="10"/>
    </svg>
  </a>

  <div class="cols">
    <!-- LEFT: upload -->
    <div class="uploadCol">
      <label class="lbl">Source Logo</label>
      <div class="drop" id="drop">
        <div class="big">Drop a logo here</div>
      </div>
      <input type="file" id="file" accept=".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml" style="display:none">
      <div class="filemeta" id="filemeta" style="display:none">
        <span id="fileinfo"></span>
        <button id="clearBtn">Remove</button>
      </div>
    </div>

    <!-- RIGHT: options -->
    <div>
      <div class="optblock">
        <label class="lbl">File Formats</label>
        <div class="checks">
          <label class="chk"><input type="checkbox" data-fmt="png" checked> PNG</label>
          <label class="chk"><input type="checkbox" data-fmt="jpg" checked> JPG</label>
          <label class="chk"><input type="checkbox" data-fmt="svg" checked> SVG</label>
          <label class="chk"><input type="checkbox" data-fmt="eps" checked> EPS</label>
        </div>
      </div>

      <div class="optblock">
        <label class="lbl">Color Space</label>
        <div class="checks">
          <label class="chk"><input type="checkbox" data-space="rgb" checked> RGB</label>
          <label class="chk"><input type="checkbox" data-space="cmyk" checked> CMYK</label>
        </div>
      </div>

      <div class="optblock">
        <label class="lbl">Treatment</label>
        <div class="checks">
          <label class="chk"><input type="checkbox" data-treat="color" checked> Color</label>
          <label class="chk"><input type="checkbox" data-treat="grayscale" checked> Grayscale</label>
        </div>
      </div>

      <div class="optblock">
        <label class="lbl">Raster Size</label>
        <div class="sizefield">
          <input type="number" id="size" value="2000" min="64" max="6000" step="1">
          <span class="note">px longest edge</span>
        </div>
      </div>

      <div class="run">
        <button id="runBtn" disabled>Generate ZIP</button>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>

</div>

<div class="canvas-stash" id="stash"></div>

<!-- Slide-down navigation overlay -->
<div class="navOverlay" id="navOverlay" aria-hidden="true">
  <button class="home-mark navClose" id="navClose" type="button" aria-label="Close McCANN Design Suite">
    <svg width="50" height="26" viewBox="0 0 50 26" fill="none" aria-hidden="true">
      <line y1="5" x2="50" y2="5" stroke="black" stroke-width="10"/>
      <line y1="21" x2="50" y2="21" stroke="black" stroke-width="10"/>
    </svg>
  </button>
  <iframe class="navFrame" id="navFrame" title="McCANN Design Suite" src="about:blank"></iframe>
</div>

<script>
/* ---------- Slide-down nav overlay ---------- */
(function(){
  const overlay = document.getElementById('navOverlay');
  const frame = document.getElementById('navFrame');
  const openBtn = document.getElementById('navOpen');
  const closeBtn = document.getElementById('navClose');
  const SRC = 'index.html';

  function showsIndex(){
    try {
      const p = frame.contentWindow.location.pathname || '';
      return /(^|\/)index\.html?$/.test(p);
    } catch(e){ return false; }
  }
  function ensureSuite(){
    if(showsIndex()) return;
    try { frame.contentWindow.location.replace(SRC); }
    catch(e){ frame.src = SRC; }
  }

  // Force the suite's links to drive the whole tab, not the iframe — robust even if a
  // cached index.html is missing <base target="_top">.
  frame.addEventListener('load', function(){
    try {
      frame.contentDocument.querySelectorAll('a[href]').forEach(function(a){ a.setAttribute('target','_top'); });
    } catch(e){}
  });

  // Preload immediately so the drawer opens instantly (no lag) and always shows the suite.
  ensureSuite();

  function openNav(e){
    if(e) e.preventDefault();
    ensureSuite();
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeNav(){
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }
  if(openBtn) openBtn.addEventListener('click', openNav);
  if(closeBtn) closeBtn.addEventListener('click', closeNav);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && overlay.classList.contains('open')) closeNav();
  });
})();
</script>

<script>
let uploaded=null; // {name, type, dataUrl, isSvg, svgText, img}

const drop=document.getElementById("drop");
const fileInput=document.getElementById("file");
const fileMeta=document.getElementById("filemeta");
const fileInfo=document.getElementById("fileinfo");
const runBtn=document.getElementById("runBtn");
const statusEl=document.getElementById("status");

/* ---------- Upload handling ---------- */
drop.addEventListener("click",()=>fileInput.click());
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag");});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");
  if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener("change",e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
document.getElementById("clearBtn").addEventListener("click",e=>{e.stopPropagation();reset();});

function reset(){
  uploaded=null; fileInput.value="";
  drop.classList.remove("has");
  drop.innerHTML='<div class="big">Drop a logo here</div>';
  fileMeta.style.display="none"; runBtn.disabled=true; statusEl.textContent="";
  updateTree();
}

function handleFile(f){
  const isSvg = f.type==="image/svg+xml" || f.name.toLowerCase().endsWith(".svg");
  const reader=new FileReader();
  reader.onload=()=>{
    const result=reader.result;
    const obj={name:f.name.replace(/\.[^.]+$/,"")||"logo", type:f.type, isSvg, svgText:null, dataUrl:null, img:null};
    if(isSvg){
      obj.svgText = (typeof result==="string" && result.indexOf("<svg")>=0) ? result : null;
      // also need a dataURL for rasterizing
      obj.dataUrl = "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(obj.svgText||"")));
    } else {
      obj.dataUrl = result;
    }
    const img=new Image();
    img.onload=()=>{ obj.img=img; uploaded=obj; showPreview(f, img); runBtn.disabled=false; updateTree(); };
    img.onerror=()=>{ statusEl.textContent="Could not read that image. Try a PNG, JPG, or SVG."; };
    img.src=obj.dataUrl;
  };
  if(isSvg) reader.readAsText(f); else reader.readAsDataURL(f);
}

function showPreview(f, img){
  drop.classList.add("has");
  drop.innerHTML='<div class="preview"><img src="'+(uploaded.dataUrl)+'" alt="preview"></div>';
  const kb=(f.size/1024).toFixed(0);
  fileInfo.textContent = f.name+" · "+img.naturalWidth+"×"+img.naturalHeight+" · "+kb+" KB"+(uploaded.isSvg?" · vector":"");
  fileMeta.style.display="flex";
}

/* ---------- Option reading ---------- */
function opts(){
  const get=(attr)=>[...document.querySelectorAll('input[data-'+attr+']:checked')].map(c=>c.dataset[attr]);
  return { fmts:get("fmt"), spaces:get("space"), treats:get("treat"), size:Math.max(64,Math.min(6000,parseInt(document.getElementById("size").value)||2000)) };
}
document.querySelectorAll('input[type=checkbox], #size').forEach(el=>el.addEventListener("change",updateTree));

/* ---------- Tree preview ---------- */
function updateTree(){
  const tv=document.getElementById("treeView");
  if(!tv) return;
  if(!uploaded){ tv.innerHTML='<span class="muted">Upload a logo and pick your options to preview the folder tree.</span>'; return; }
  const {fmts,spaces,treats}=opts();
  if(!fmts.length||!spaces.length||!treats.length){ tv.innerHTML='<span class="muted">Select at least one format, color space, and treatment.</span>'; return; }
  const base=uploaded.name;
  let out=base+"-Exports/\n";
  const spaceLabel={rgb:"RGB",cmyk:"CMYK"}, treatLabel={color:"COLOR",grayscale:"GRAYSCALE"};
  spaces.forEach((sp,si)=>{
    const last=si===spaces.length-1;
    out+=(last?"└─ ":"├─ ")+spaceLabel[sp]+"/\n";
    treats.forEach((tr,ti)=>{
      const tlast=ti===treats.length-1;
      const pad=last?"   ":"│  ";
      out+=pad+(tlast?"└─ ":"├─ ")+treatLabel[tr]+"/\n";
      fmts.forEach((fm,fi)=>{
        const flast=fi===fmts.length-1;
        const pad2=pad+(tlast?"   ":"│  ");
        out+=pad2+(flast?"└─ ":"├─ ")+base+"-"+spaceLabel[sp].toLowerCase()+"-"+treatLabel[tr].toLowerCase()+"."+fm+"\n";
      });
    });
  });
  out+="README.txt";
  tv.textContent=out;
}

/* ---------- Raster helpers ---------- */
function drawToCanvas(img, size, {gray=false, matte=null}={}){
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  const scale=size/Math.max(w,h);
  const cw=Math.round(w*scale), ch=Math.round(h*scale);
  const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  const x=cv.getContext("2d");
  if(matte){ x.fillStyle=matte; x.fillRect(0,0,cw,ch); }
  x.drawImage(img,0,0,cw,ch);
  if(gray){
    const id=x.getImageData(0,0,cw,ch); const d=id.data;
    for(let i=0;i<d.length;i+=4){
      const l=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
      d[i]=d[i+1]=d[i+2]=l;
    }
    x.putImageData(id,0,0);
  }
  return cv;
}
function canvasBlob(cv,type,q){ return new Promise(res=>cv.toBlob(res,type,q)); }

/* ---------- SVG helpers ---------- */
function svgGrayWrap(innerSvgOrImg, isVector, dataUrl, w, h){
  // Wrap with a grayscale filter. For vector we inline; for raster we embed the image.
  const filter='<filter id="g"><feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/></filter>';
  if(isVector && innerSvgOrImg){
    // inject filter into existing svg root
    let s=innerSvgOrImg;
    if(/<svg[^>]*>/i.test(s)){
      s=s.replace(/<svg([^>]*)>/i,'<svg$1><defs>'+filter+'</defs><g filter="url(#g)">');
      s=s.replace(/<\/svg>\s*$/i,'</g></svg>');
    }
    return s;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${filter}</defs><image filter="url(#g)" width="${w}" height="${h}" href="${dataUrl}"/></svg>`;
}
function svgColorWrap(isVector, svgText, dataUrl, w, h){
  if(isVector && svgText) return svgText;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><image width="${w}" height="${h}" href="${dataUrl}"/></svg>`;
}

/* ---------- EPS generation ----------
   Two paths:
   (A) SVG source  -> TRUE VECTOR EPS: parse SVG geometry, emit PostScript paths.
   (B) Raster source -> embedded-bitmap EPS, guarded against oversized pixel streams.
*/

// Parse a CSS/SVG color into [r,g,b] 0..1, or null for none/transparent.
function parseColorToPS(col, fallback){
  if(col==null || col==="none" || col==="transparent") {
    return fallback===undefined ? null : fallback;
  }
  col=String(col).trim();
  if(col==="currentColor") col="#000";
  // hex
  let m=col.match(/^#([0-9a-f]{3})$/i);
  if(m){ const s=m[1]; return [parseInt(s[0]+s[0],16)/255,parseInt(s[1]+s[1],16)/255,parseInt(s[2]+s[2],16)/255]; }
  m=col.match(/^#([0-9a-f]{6})$/i);
  if(m){ const s=m[1]; return [parseInt(s.slice(0,2),16)/255,parseInt(s.slice(2,4),16)/255,parseInt(s.slice(4,6),16)/255]; }
  m=col.match(/^rgba?\(([^)]+)\)$/i);
  if(m){ const p=m[1].split(",").map(s=>parseFloat(s)); return [(p[0]||0)/255,(p[1]||0)/255,(p[2]||0)/255]; }
  // named colors: resolve via canvas
  try{ const c=document.createElement("canvas"); c.width=c.height=1; const x=c.getContext("2d");
    x.fillStyle="#000"; x.fillStyle=col; x.fillRect(0,0,1,1);
    const d=x.getImageData(0,0,1,1).data; return [d[0]/255,d[1]/255,d[2]/255];
  }catch(e){ return fallback===undefined?null:fallback; }
}
function toGrayPS(rgb){ if(!rgb) return null; const l=0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2]; return [l,l,l]; }
// Uncalibrated RGB->CMYK (standard formula, NOT profile-accurate — see README).
// Input rgb in 0..1, output [c,m,y,k] in 0..1.
function rgbToCmyk(rgb){
  if(!rgb) return null;
  const r=rgb[0],g=rgb[1],b=rgb[2];
  const k=1-Math.max(r,g,b);
  if(k>=1) return [0,0,0,1]; // pure black, avoid divide-by-zero
  const c=(1-r-k)/(1-k), m=(1-g-k)/(1-k), y=(1-b-k)/(1-k);
  return [c,m,y,k];
}
function ps(n){ return (Math.round(n*1000)/1000); } // trim float noise

// Convert one SVG path 'd' string into PostScript path ops (absolute coords already flipped by caller transform).
function pathDataToPS(d){
  // Tokenize path data
  const tokens=d.match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
  if(!tokens) return "";
  let i=0, cmd="", out="";
  let cx=0, cy=0, sx=0, sy=0, px=0, py=0, prevCmd="";
  const num=()=>parseFloat(tokens[i++]);
  const isCmd=t=>/^[a-zA-Z]$/.test(t);
  while(i<tokens.length){
    if(isCmd(tokens[i])){ cmd=tokens[i++]; }
    const abs=cmd===cmd.toUpperCase(); const C=cmd.toUpperCase();
    if(C==="M"){
      let x=num(), y=num(); if(!abs){x+=cx;y+=cy;}
      cx=x;cy=y;sx=x;sy=y; out+=`${ps(x)} ${ps(y)} moveto\n`;
      cmd = abs ? "L" : "l"; // subsequent pairs are lineto
    } else if(C==="L"){
      let x=num(), y=num(); if(!abs){x+=cx;y+=cy;} cx=x;cy=y; out+=`${ps(x)} ${ps(y)} lineto\n`;
    } else if(C==="H"){
      let x=num(); if(!abs)x+=cx; cx=x; out+=`${ps(x)} ${ps(cy)} lineto\n`;
    } else if(C==="V"){
      let y=num(); if(!abs)y+=cy; cy=y; out+=`${ps(cx)} ${ps(y)} lineto\n`;
    } else if(C==="C"){
      let x1=num(),y1=num(),x2=num(),y2=num(),x=num(),y=num();
      if(!abs){x1+=cx;y1+=cy;x2+=cx;y2+=cy;x+=cx;y+=cy;}
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=x2;py=y2;cx=x;cy=y;
    } else if(C==="S"){
      let x2=num(),y2=num(),x=num(),y=num();
      if(!abs){x2+=cx;y2+=cy;x+=cx;y+=cy;}
      let x1=cx,y1=cy; if(prevCmd && "CS".includes(prevCmd.toUpperCase())){ x1=2*cx-px; y1=2*cy-py; }
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=x2;py=y2;cx=x;cy=y;
    } else if(C==="Q"){
      let qx=num(),qy=num(),x=num(),y=num();
      if(!abs){qx+=cx;qy+=cy;x+=cx;y+=cy;}
      // convert quadratic to cubic
      const x1=cx+2/3*(qx-cx), y1=cy+2/3*(qy-cy), x2=x+2/3*(qx-x), y2=y+2/3*(qy-y);
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=qx;py=qy;cx=x;cy=y;
    } else if(C==="T"){
      let x=num(),y=num(); if(!abs){x+=cx;y+=cy;}
      let qx=cx,qy=cy; if(prevCmd && "QT".includes(prevCmd.toUpperCase())){ qx=2*cx-px; qy=2*cy-py; }
      const x1=cx+2/3*(qx-cx), y1=cy+2/3*(qy-cy), x2=x+2/3*(qx-x), y2=y+2/3*(qy-y);
      out+=`${ps(x1)} ${ps(y1)} ${ps(x2)} ${ps(y2)} ${ps(x)} ${ps(y)} curveto\n`;
      px=qx;py=qy;cx=x;cy=y;
    } else if(C==="A"){
      // Arc: approximate by line to endpoint (rare in logos; keeps file valid)
      let rx=num(),ry=num(),rot=num(),laf=num(),sf=num(),x=num(),y=num();
      if(!abs){x+=cx;y+=cy;} cx=x;cy=y; out+=`${ps(x)} ${ps(y)} lineto\n`;
    } else if(C==="Z"){
      out+=`closepath\n`; cx=sx;cy=sy;
    } else { i++; }
    prevCmd=cmd;
  }
  return out;
}

// Convert basic shape elements to a path 'd' string.
function shapeToPathD(el){
  const tag=el.tagName.toLowerCase();
  const n=a=>parseFloat(el.getAttribute(a)||0);
  if(tag==="rect"){
    const x=n("x"),y=n("y"),w=n("width"),h=n("height");
    return `M${x} ${y} H${x+w} V${y+h} H${x} Z`;
  }
  if(tag==="line"){ return `M${n("x1")} ${n("y1")} L${n("x2")} ${n("y2")}`; }
  if(tag==="polyline"||tag==="polygon"){
    const pts=(el.getAttribute("points")||"").trim().split(/[\s,]+/).map(Number);
    let d=""; for(let i=0;i<pts.length;i+=2){ d+=(i===0?"M":"L")+pts[i]+" "+pts[i+1]+" "; }
    if(tag==="polygon") d+="Z"; return d;
  }
  if(tag==="circle"){
    const cx=n("cx"),cy=n("cy"),r=n("r"); const k=0.5522847498*r;
    return `M${cx-r} ${cy} C${cx-r} ${cy-k} ${cx-k} ${cy-r} ${cx} ${cy-r} C${cx+k} ${cy-r} ${cx+r} ${cy-k} ${cx+r} ${cy} C${cx+r} ${cy+k} ${cx+k} ${cy+r} ${cx} ${cy+r} C${cx-k} ${cy+r} ${cx-r} ${cy+k} ${cx-r} ${cy} Z`;
  }
  if(tag==="ellipse"){
    const cx=n("cx"),cy=n("cy"),rx=n("rx"),ry=n("ry"); const kx=0.5522847498*rx,ky=0.5522847498*ry;
    return `M${cx-rx} ${cy} C${cx-rx} ${cy-ky} ${cx-kx} ${cy-ry} ${cx} ${cy-ry} C${cx+kx} ${cy-ry} ${cx+rx} ${cy-ky} ${cx+rx} ${cy} C${cx+rx} ${cy+ky} ${cx+kx} ${cy+ry} ${cx} ${cy+ry} C${cx-kx} ${cy+ry} ${cx-rx} ${cy+ky} ${cx-rx} ${cy} Z`;
  }
  if(tag==="path"){ return el.getAttribute("d")||""; }
  return "";
}

// TRUE vector EPS from an SVG string.
function epsFromSvg(svgText, {gray=false, cmyk=false}={}){
  const doc=new DOMParser().parseFromString(svgText,"image/svg+xml");
  const svg=doc.querySelector("svg");
  if(!svg) return null;
  // Determine viewBox / size
  let vb=(svg.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number);
  let W,H,minX=0,minY=0;
  if(vb.length===4){ minX=vb[0];minY=vb[1];W=vb[2];H=vb[3]; }
  else { W=parseFloat(svg.getAttribute("width"))||300; H=parseFloat(svg.getAttribute("height"))||150; }

  const shapeEls=svg.querySelectorAll("path,rect,circle,ellipse,line,polyline,polygon");
  let body="";
  shapeEls.forEach(el=>{
    const d=shapeToPathD(el); if(!d) return;
    const psPath=pathDataToPS(d); if(!psPath.trim()) return;
    // resolve fill: inline attr, then style attr, default black per SVG spec
    const styleFill=(el.getAttribute("style")||"").match(/fill\s*:\s*([^;]+)/i);
    const fillRaw = (el.getAttribute("fill")) || (styleFill&&styleFill[1]) || "#000";
    let fill=parseColorToPS(fillRaw, [0,0,0]);
    const styleStroke=(el.getAttribute("style")||"").match(/stroke\s*:\s*([^;]+)/i);
    const strokeRaw=(el.getAttribute("stroke"))||(styleStroke&&styleStroke[1])||null;
    let stroke=parseColorToPS(strokeRaw);
    const sw=parseFloat(el.getAttribute("stroke-width")|| (el.getAttribute("style")||"").match(/stroke-width\s*:\s*([\d.]+)/i)?.[1] ||1);
    if(gray){ fill=toGrayPS(fill); stroke=toGrayPS(stroke); }
    const colorOp=(rgb)=>{
      if(cmyk){ const c=rgbToCmyk(rgb); return `${ps(c[0])} ${ps(c[1])} ${ps(c[2])} ${ps(c[3])} setcmykcolor`; }
      return `${ps(rgb[0])} ${ps(rgb[1])} ${ps(rgb[2])} setrgbcolor`;
    };
    if(fill){
      body+=`${colorOp(fill)}\n${psPath}fill\n`;
    }
    if(stroke){
      body+=`${colorOp(stroke)}\n${ps(sw)} setlinewidth\n${psPath}stroke\n`;
    }
  });

  const eps=`%!PS-Adobe-3.0 EPSF-3.0
%%Creator: McCANN Export (vector)
%%Title: ${cmyk?"vector EPS — CMYK (uncalibrated, see README)":"vector EPS — RGB"}
%%BoundingBox: 0 0 ${Math.ceil(W)} ${Math.ceil(H)}
%%LanguageLevel: 2
%%DocumentProcessColors: ${cmyk?"Cyan Magenta Yellow Black":"(RGB)"}
%%EndComments
gsave
% flip Y to match SVG's top-left origin
0 ${ps(H)} translate
1 -1 scale
% shift by viewBox origin
${ps(-minX)} ${ps(-minY)} translate
1 setlinejoin
1 setlinecap
${body}grestore
showpage
%%EOF`;
  return new Blob([eps],{type:"application/postscript"});
}

// Raster EPS fallback (embedded bitmap), guarded to avoid giant hex strings.
function epsFromCanvas(cv, cmyk){
  const MAX=600; // cap embedded raster dimension to keep the hex stream sane
  let src=cv;
  if(Math.max(cv.width,cv.height)>MAX){
    const s=MAX/Math.max(cv.width,cv.height);
    const tmp=document.createElement("canvas");
    tmp.width=Math.round(cv.width*s); tmp.height=Math.round(cv.height*s);
    tmp.getContext("2d").drawImage(cv,0,0,tmp.width,tmp.height);
    src=tmp;
  }
  const w=src.width,h=src.height;
  const data=src.getContext("2d").getImageData(0,0,w,h).data;
  let hex="";
  for(let i=0;i<data.length;i+=4){
    hex+=data[i].toString(16).padStart(2,"0")+data[i+1].toString(16).padStart(2,"0")+data[i+2].toString(16).padStart(2,"0");
  }
  const head=`%!PS-Adobe-3.0 EPSF-3.0
%%Creator: McCANN Export (embedded raster)
%%Title: raster EPS${cmyk?" (CMYK intent — see README)":""}
%%BoundingBox: 0 0 ${w} ${h}
%%LanguageLevel: 2
%%EndComments
gsave
${w} ${h} scale
${w} ${h} 8 [${w} 0 0 -${h} 0 ${h}]
{<${hex}>} false 3 colorimage
grestore
showpage
%%EOF`;
  return new Blob([head],{type:"application/postscript"});
}

/* ---------- Main generate ---------- */
document.getElementById("runBtn").addEventListener("click",generate);

async function generate(){
  if(!uploaded) return;
  const {fmts,spaces,treats,size}=opts();
  if(!fmts.length||!spaces.length||!treats.length){ statusEl.textContent="Pick at least one format, color space, and treatment."; return; }
  runBtn.disabled=true; statusEl.textContent="Rendering…";

  try{
    const zip=new JSZip();
    const base=uploaded.name;
    const root=zip.folder(base+"-Exports");
    const img=uploaded.img;
    const spaceLabel={rgb:"RGB",cmyk:"CMYK"}, treatLabel={color:"COLOR",grayscale:"GRAYSCALE"};

    let count=0;
    for(const sp of spaces){
      const cmyk = sp==="cmyk";
      for(const tr of treats){
        const gray = tr==="grayscale";
        const dir=root.folder(spaceLabel[sp]).folder(treatLabel[tr]);
        const stem=base+"-"+spaceLabel[sp].toLowerCase()+"-"+treatLabel[tr].toLowerCase();

        // raster canvases
        const cvPng=drawToCanvas(img,size,{gray});                  // transparent
        const cvJpg=drawToCanvas(img,size,{gray,matte:"#ffffff"});  // white matte

        for(const fm of fmts){
          if(fm==="png"){ dir.file(stem+".png", await canvasBlob(cvPng,"image/png")); }
          else if(fm==="jpg"){ dir.file(stem+".jpg", await canvasBlob(cvJpg,"image/jpeg",0.92)); }
          else if(fm==="svg"){
            const w=cvPng.width,h=cvPng.height;
            const pngUrl=cvPng.toDataURL("image/png");
            const svg = gray
              ? svgGrayWrap(uploaded.svgText, uploaded.isSvg, pngUrl, w, h)
              : svgColorWrap(uploaded.isSvg, uploaded.svgText, pngUrl, w, h);
            dir.file(stem+".svg", svg);
          }
          else if(fm==="eps"){
            let epsBlob=null;
            if(uploaded.isSvg && uploaded.svgText){
              epsBlob=epsFromSvg(uploaded.svgText,{gray,cmyk});
            }
            if(!epsBlob){ epsBlob=epsFromCanvas(cvJpg, cmyk); } // raster fallback (also if SVG parse failed)
            dir.file(stem+".eps", epsBlob);
          }
          count++;
        }
      }
    }

    root.file("README.txt", readmeText(base));
    statusEl.textContent="Packaging "+count+" files…";
    const blob=await zip.generateAsync({type:"blob"},meta=>{
      statusEl.textContent="Packaging… "+Math.round(meta.percent)+"%";
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=base+"-Exports.zip"; a.click();
    statusEl.textContent="Done. "+count+" files across "+(spaces.length*treats.length)+" folders.";
  }catch(err){
    console.error(err);
    statusEl.textContent="Something went wrong while generating. Check the console.";
  }finally{
    runBtn.disabled=false;
  }
}

function readmeText(base){
  return `${base} — Export package
Generated by the McCANN Export tool (prototype)

FOLDER STRUCTURE
  ${base}-Exports/
    RGB/ and CMYK/      → color space
      COLOR/ GRAYSCALE/ → treatment
        .png .jpg .svg .eps → formats

WHAT IS REAL
  PNG   Real raster, transparent background.
  JPG   Real raster, flattened on white.
  SVG   Vector if you uploaded an SVG; otherwise the raster is embedded
        inside an SVG wrapper. Grayscale uses an SVG color-matrix filter.
  EPS   If you uploaded an SVG, the EPS is TRUE VECTOR — the shapes are
        converted to PostScript paths (moveto/lineto/curveto) and open as
        editable vector art in Illustrator. If you uploaded a PNG/JPG, the
        EPS embeds the bitmap instead (a photo can't be vectorized without
        tracing). For best EPS results, upload vector SVG.
  GRAYSCALE  Real luminance conversion (Rec. 709 weights).

EPS SUPPORT NOTES
  Supported SVG elements: path, rect, circle, ellipse, line, polyline,
  polygon, with fill and stroke colors. Arcs (A commands) are approximated.
  Very complex SVGs with gradients, filters, or clip paths will lose those
  effects — the geometry converts, the effects don't.

IMPORTANT LIMITS (please read)
  CMYK  Two different things depending on format:

        EPS (from an SVG upload) — REAL CMYK. The file writes four-channel
        ink values directly with the PostScript setcmykcolor operator, so a
        printer's RIP reads true C/M/Y/K, not converted RGB. HOWEVER the
        values come from a standard uncalibrated formula, NOT an ICC press
        profile. Colors are in the right space but may shift on press.
        Always soft-proof and adjust in Illustrator against your actual
        profile (US Web Coated SWOP, GRACoL, Fogra39) before final output.

        PNG / JPG / SVG / raster EPS — these stay RGB. A browser cannot do
        profile-accurate CMYK raster separation; those files are organized
        under CMYK for handoff labeling only. Convert rasters in
        Photoshop/Illustrator against your print profile.

  Bottom line: for print, upload SVG and use the CMYK EPS as your starting
  point, then verify color in Adobe tools.

Treat this package as a fast first pass for screen and layout use. Anything
going to press should be finalized in Adobe tools against the right profile.`;
}
