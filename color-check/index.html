/* Color-check — suite language (export / varlogo) */
.ada{
  --ada-fs:var(--suite-fs);
  --ada-track:-1px;
  --ada-label:#969696;
  --ada-chip:#757575;
  --ada-fill:#F4F4F4;
  --ada-radius:5px;
  --ada-stage-radius:10px;
  --ada-stage-stroke:2px solid var(--ada-fill);
  display:contents;
}

.ada__title,
.ada__band,
.ada__desc,
.ada__stage,
.ada__hex,
.ada__matrix{
  font-family:var(--sans);
  font-size:var(--ada-fs);
  font-weight:400;
  letter-spacing:var(--ada-track);
  line-height:1.2;
  color:#000;
}

.ada__title{
  grid-column:1;
  grid-row:2;
  margin:0;
  padding:0;
  color:#000000;
  white-space:nowrap;
  align-self:start;
  z-index:2;
}

.ada__band{
  grid-column:2 / -1;
  grid-row:2;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
  align-self:start;
  z-index:2;
}

.ada__desc{
  margin:0;
  padding:0;
  color:var(--ada-label);
  flex:0 0 auto;
}

.ada__controls{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  grid-template-rows:auto auto;
  column-gap:var(--suite-gutter);
  row-gap:15px;
  align-items:start;
  flex:0 0 auto;
  min-height:0;
}

.ada__group{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}
.ada__group--standard{ grid-column:1; grid-row:1; }
.ada__group--filter{ grid-column:2; grid-row:1; }
.ada__group--font{ grid-column:1; grid-row:2; }
.ada__group--export{ grid-column:2; grid-row:2; }
.ada__group--results{ grid-column:3; grid-row:1 / -1; align-self:start; }

.ada__label{
  margin:0;
  color:var(--ada-label);
  font:inherit;
  letter-spacing:inherit;
  line-height:1.2;
}

.ada__pills{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:34px;
}

.ada__pill,
.ada .opt.ada__pill{
  appearance:none;
  border:0;
  margin:0;
  padding:5px 10px;
  height:34px;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font:inherit;
  font-weight:400;
  letter-spacing:inherit;
  line-height:1;
  color:var(--ada-chip);
  background:transparent;
  border-radius:var(--ada-radius);
  cursor:pointer;
  text-transform:none;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.ada__pill:hover,
.ada .opt.ada__pill:hover{ color:#000; }
.ada__pill.is-active,
.ada .opt.ada__pill.is-active{
  background:var(--ada-fill);
  color:var(--ada-chip);
}
.ada__pill.is-active:hover,
.ada .opt.ada__pill.is-active:hover{ color:#000; }

.ada__chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:34px;
}

.ada .font-wrap{ position:relative; }
.ada .font-menu{
  top:calc(100% + 4px);
  left:0;
  min-width:160px;
  border:var(--ada-stage-stroke);
  border-radius:var(--ada-radius);
  background:#fff;
  box-shadow:none;
  padding:4px;
  z-index:20;
}
.ada .font-menu .opt{
  font-size:var(--ada-fs);
  letter-spacing:var(--ada-track);
  font-weight:400;
  color:var(--ada-chip);
  border-radius:var(--ada-radius);
  padding:8px 10px;
}
.ada .font-menu .opt.is-active,
.ada .font-menu .opt:hover{
  background:var(--ada-fill);
  color:#000;
}
.ada .chip.ada__pill .chev{
  width:10px;
  height:6px;
  opacity:.55;
}

.ada__stats{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  align-content:start;
  padding:0;
  margin:0;
}
.ada__stat{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  color:var(--ada-label);
  min-height:0;
  padding:0;
  border-bottom:0;
  box-sizing:border-box;
  line-height:1.2;
}
.ada__stat-lbl{ color:var(--ada-label); }
.ada__stat-val{ color:var(--ada-chip); }

.ada__status{
  margin:0;
  color:var(--ada-label);
  min-height:1.2em;
}

.ada__stage{
  grid-column:2 / -1;
  grid-row:3 / -1;
  display:flex;
  flex-direction:column;
  gap:var(--suite-gutter);
  min-width:0;
  min-height:0;
  align-self:stretch;
  justify-self:stretch;
  z-index:1;
}

.ada__source-head{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  column-gap:var(--suite-gutter);
  align-items:center;
  flex:0 0 auto;
  min-width:0;
  min-height:34px;
}
.ada__source-head .ada__label{ grid-column:1; align-self:center; }
.ada__meta{
  grid-column:2 / -1;
  display:none;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-width:0;
}
.ada__meta.is-on{ display:flex; }
.ada__tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:34px;
  padding:5px 10px;
  box-sizing:border-box;
  background:var(--ada-fill);
  border-radius:var(--ada-radius);
  color:var(--ada-chip);
  font:inherit;
  letter-spacing:inherit;
  line-height:1;
  white-space:nowrap;
}

.ada__hex{
  flex:0 0 auto;
  min-height:110px;
  max-height:160px;
  border:var(--ada-stage-stroke);
  border-radius:var(--ada-stage-radius);
  padding:12px 14px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.ada__hex .field{
  flex:1 1 auto;
  width:100%;
  min-height:0;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  font:inherit;
  letter-spacing:inherit;
  line-height:1.35;
  color:var(--ada-label);
  padding:0;
}
.ada__hex .field::placeholder{ color:var(--ada-label); }

.ada__matrix{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  border:var(--ada-stage-stroke);
  border-radius:var(--ada-stage-radius);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.ada__matrix .matrixWrap{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding:10px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}
.ada .empty{
  margin:auto;
  color:var(--ada-label);
  font:inherit;
  letter-spacing:inherit;
  text-align:center;
  align-self:center;
}

/* Matrix: hex headers + cell ink at 13px; boxes stay sized by layout */
.ada table.matrix th,
.ada table.matrix td{
  letter-spacing:var(--ada-track);
}
.ada table.matrix th.head,
.ada table.matrix td.cell .val,
.ada table.matrix td.cell .grade{
  font-size:13px;
  letter-spacing:var(--ada-track);
}
.ada table.matrix th.head,
.ada table.matrix th.corner{
  color:var(--ada-label);
  font-weight:400;
}
.ada table.matrix td.diag{
  background:transparent;
}

@media (max-width:900px){
  .ada__controls{
    grid-template-columns:1fr 1fr;
  }
  .ada__group--standard{ grid-column:1; grid-row:1; }
  .ada__group--filter{ grid-column:2; grid-row:1; }
  .ada__group--font{ grid-column:1; grid-row:2; }
  .ada__group--export{ grid-column:2; grid-row:2; }
  .ada__group--results{ grid-column:1 / -1; grid-row:3; }
}
</style>
</head>
<body>

<div class="ada">
  <h1 class="ada__title">Color-check</h1>

  <div class="ada__band">
    <p class="ada__desc">This tool checks contrast across every foreground and background pairing in a palette.</p>

    <div class="ada__controls">
      <div class="ada__group ada__group--standard">
        <div class="ada__label">Standard</div>
        <div class="ada__pills" id="segStandard" role="listbox" aria-label="Standard">

          <button type="button" class="opt ada__pill" data-v="AALarge" role="option" aria-selected="false">AA Lg+</button>
          <button type="button" class="opt ada__pill" data-v="AA" role="option" aria-selected="false">AA+</button>

      <div class="ada__group ada__group--font">
        <div class="ada__label">Chart font</div>
        <div class="ada__chip-row">
          <div class="font-wrap">
            <button type="button" class="chip ada__pill is-active" id="fontChip" aria-haspopup="listbox" aria-expanded="false">
              <span id="fontChipLabel">Inter</span>
              <img class="chev" src="../assets/chevron.svg" alt="" width="10" height="6">
            </button>
            <div class="font-menu" id="fontMenu" role="listbox">
              <button class="opt is-active" data-font="Inter" role="option">Inter</button>
              <button class="opt" data-font="__display" role="option">McCann</button>
              <button class="opt" data-font="__mono" role="option">System Mono</button>
            </div>
          </div>
          <button type="button" class="chip ada__pill is-active" id="fontUploadBtn">Upload</button>
          <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden>
        </div>
        <p class="ada__status" id="fontHint"></p>
      </div>

      <div class="ada__group ada__group--export">
        <div class="ada__label">Export</div>
        <div class="ada__pills" id="exportActions" role="listbox" aria-label="Export">
          <button type="button" class="opt ada__pill is-active" data-exp="svg" role="option" aria-selected="true">.svg</button>
          <button type="button" class="opt ada__pill" data-exp="html" role="option" aria-selected="false">.html</button>
        </div>
      </div>

      </div>

  </div>

  <div class="ada__stage">
    <div class="ada__source-head">
      <p class="ada__label">Palette</p>
      <div class="ada__meta" id="paletteMeta">
        <span class="ada__tag" id="countColors"></span>
        <span class="ada__tag" id="countPairs"></span>
      </div>
    </div>
    <div class="ada__hex">
      <textarea id="input" class="field" spellcheck="false" aria-label="Hex values" placeholder="Paste HEX values"></textarea>
    </div>

    <div class="ada__source-head">
      <p class="ada__label">Matrix</p>
    </div>
    <div class="ada__matrix">
      <div class="matrixWrap" id="matrixWrap"></div>
    </div>
  </div>
</div>

<div id="modalMount"></div>

<script src="../assets/nav.js"></script>
<script>

/* ---------- Color math ---------- */
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function hexToRgb(hex){ let h=hex.trim().replace(/^#/,""); if(h.length===3)h=h.split("").map(c=>c+c).join(""); if(!/^[0-9a-fA-F]{6}$/.test(h))return null; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const rgbToHex = ([r,g,b]) => "#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("").toUpperCase();
function relLum([r,g,b]){ const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}; return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); }
function wcagRatio(a,b){ const L1=relLum(a),L2=relLum(b); const lo=Math.min(L1,L2),hi=Math.max(L1,L2); return (hi+0.05)/(lo+0.05); }
function apcaContrast(txt,bg){
  const Y=rgb=>{const lin=c=>Math.pow(c/255,2.4); return 0.2126729*lin(rgb[0])+0.7151522*lin(rgb[1])+0.072175*lin(rgb[2]);};
  let Yt=Y(txt),Yb=Y(bg); const bt=0.022,bc=1.414; const cb=y=>y>bt?y:y+Math.pow(bt-y,bc); Yt=cb(Yt);Yb=cb(Yb);
  if(Math.abs(Yb-Yt)<0.0005)return 0; let o;
  if(Yb>Yt){o=(Math.pow(Yb,0.56)-Math.pow(Yt,0.57))*1.14; o=o<0.001?0:o-0.027;}
  else{o=(Math.pow(Yb,0.65)-Math.pow(Yt,0.62))*1.14; o=o>-0.001?0:o+0.027;}
  return o*100;
}
/* OKLCH for repair */
function s2l(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function l2s(c){const v=c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;return clamp(v*255,0,255);}
function rgbToOklch([r,g,b]){const lr=s2l(r),lg=s2l(g),lb=s2l(b);
  const l=0.4122214708*lr+0.5363325363*lg+0.0514459929*lb,m=0.2119034982*lr+0.6806995451*lg+0.1073969566*lb,s=0.0883024619*lr+0.2817188376*lg+0.6299787005*lb;
  const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
  const L=0.2104542553*l_+0.793617785*m_-0.0040720468*s_,a=1.9779984951*l_-2.428592205*m_+0.4505937099*s_,bb=0.0259040371*l_+0.7827717662*m_-0.808675766*s_;
  const C=Math.sqrt(a*a+bb*bb); let H=Math.atan2(bb,a)*180/Math.PI; if(H<0)H+=360; return {L,C,H};}
function oklchToRgb({L,C,H}){const hr=H*Math.PI/180,a=C*Math.cos(hr),bb=C*Math.sin(hr);
  const l_=L+0.3963377774*a+0.2158037573*bb,m_=L-0.1055613458*a-0.0638541728*bb,s_=L-0.0894841775*a-1.291485548*bb;
  const l=l_**3,m=m_**3,s=s_**3;
  const lr=4.0767416621*l-3.3077115913*m+0.2309699292*s,lg=-1.2684380046*l+2.6097574011*m-0.3413193965*s,lb=-0.0041960863*l-0.7034186147*m+1.707614701*s;
  return [l2s(lr),l2s(lg),l2s(lb)];}
function repair(fixRgb,againstRgb,target){
  const againstL=relLum(againstRgb); const base=rgbToOklch(fixRgb); const goDarker=relLum(fixRgb)<againstL;
  for(let i=1;i<=100;i++){ const L=goDarker?base.L-i*0.01:base.L+i*0.01; if(L<0||L>1)continue;
    const rgb=oklchToRgb({L,C:base.C,H:base.H}).map(Math.round);
    if(wcagRatio(rgb,againstRgb)>=target) return rgbToHex(rgb); }
  return null;
}
function rateWcag(r){ if(r>=7)return{grade:"AAA",tier:3}; if(r>=4.5)return{grade:"AA",tier:2}; if(r>=3)return{grade:"AA Lg",tier:1}; return{grade:"Fail",tier:0}; }
function rateApca(s){ const a=Math.abs(s); if(a>=75)return{grade:"AAA",tier:3}; if(a>=60)return{grade:"AA",tier:2}; if(a>=45)return{grade:"AA Lg",tier:1}; return{grade:"Fail",tier:0}; }

/* Grade signal palette (from the ADA mock) — tier 0..3 = Fail, AA Lg, AA, AAA */
const GRADE=["#FF0004","#FFD400","#B6E662","#0FB800"];
function gradeColor(t){ return GRADE[t]; }

function parseColors(text){ const found=text.match(/#?[0-9a-fA-F]{6}\b|#?[0-9a-fA-F]{3}\b/g)||[]; const seen=new Set(),out=[];
  for(let raw of found){ let hex=raw.startsWith("#")?raw:"#"+raw; const rgb=hexToRgb(hex); if(!rgb)continue; const n=rgbToHex(rgb); if(!seen.has(n)){seen.add(n);out.push(n);} } return out; }


/* ---------- State ---------- */
const DEFAULT="";
let state = { input: DEFAULT, standard: "wcag", threshold: "all", chartFont: "Inter", exportKind: "svg" };

let fontDataUrl = null;

function chartFontStack(){
  if(state.chartFont==="__mono") return "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
  if(state.chartFont==="__display") return "'McCann Headline', Inter, sans-serif";
  return "'"+state.chartFont+"', Inter, sans-serif";
}

function cellData(fgHex,bgHex){
  const fg=hexToRgb(fgHex),bg=hexToRgb(bgHex);
  if(state.standard==="wcag"){ const r=wcagRatio(fg,bg); return {...rateWcag(r), value:r.toFixed(2)}; }
  const s=apcaContrast(fg,bg); return {...rateApca(s), value:(s>=0?"+":"")+s.toFixed(0)};
}

function syncRail(segId, thumbId){
  const seg=document.getElementById(segId);
  if(!seg) return;
  // Multi-column rails (Show only): only the active column gets a thumb
  const thumbs=seg.querySelectorAll(".rail__thumb");
  if(thumbs.length>1){
    const active=seg.querySelector(".opt.is-active");
    thumbs.forEach(t=>{ t.style.opacity="0"; });
    if(!active) return;
    const body=active.closest(".rail-body");
    const thumb=body && body.querySelector(".rail__thumb");
    const opts=body && body.querySelector(".rail-opts");
    if(!thumb||!opts) return;
    const first=opts.querySelector(".opt");
    thumb.style.opacity="1";
    thumb.style.top=(active.offsetTop-(first?first.offsetTop:0))+"px";
    thumb.style.height=Math.max(9, active.offsetHeight)+"px";
    return;
  }
  const thumb=document.getElementById(thumbId) || seg.querySelector(".rail__thumb");
  const active=seg.querySelector(".opt.is-active");
  if(!active||!thumb) return;
  const first=seg.querySelector(".opt");
  thumb.style.top=(active.offsetTop-(first?first.offsetTop:0))+"px";
  thumb.style.height=Math.max(9, active.offsetHeight)+"px";
}

function setActive(seg, btn){
  document.querySelectorAll("#"+seg+" .opt").forEach(b=>{
    b.classList.remove("is-active");
    b.setAttribute("aria-selected","false");
  });
  btn.classList.add("is-active");
  btn.setAttribute("aria-selected","true");
}

function fontLabel(){
  if(state.chartFont==="__display") return "McCann";
  if(state.chartFont==="__mono") return "Mono";
  return state.chartFont;
}

/* ---------- Render ---------- */
function render(){
  const colors = parseColors(state.input);
  const minTier = {all:0,AALarge:1,AA:2,AAA:3}[state.threshold];

  document.getElementById("countColors").textContent = colors.length+" colors";
  document.getElementById("countPairs").textContent = (colors.length*(colors.length-1))+" pairings";
  document.getElementById("paletteMeta").classList.toggle("is-on", colors.length > 0);

  let total=0,pass=0,fail=0;
  for(const fg of colors)for(const bg of colors){ if(fg===bg)continue; total++; const c=cellData(fg,bg); if(c.tier>=2)pass++; else if(c.tier===0)fail++; }
  const large=total-pass-fail;
  const usable=total?Math.round(pass/total*100)+"%":"—";
  document.getElementById("score").innerHTML =
    `<div class="ada__stat"><span class="ada__stat-lbl">Pass</span><span class="ada__stat-val">${pass}</span></div>`+
    `<div class="ada__stat"><span class="ada__stat-lbl">Large only</span><span class="ada__stat-val">${large}</span></div>`+
    `<div class="ada__stat"><span class="ada__stat-lbl">Fail</span><span class="ada__stat-val">${fail}</span></div>`+
    `<div class="ada__stat is-emphasis"><span class="ada__stat-lbl">Usable</span><span class="ada__stat-val">${usable}</span></div>`;

  document.getElementById("fontChipLabel").textContent = fontLabel();

  syncRail("segStandard","thumbStandard");
  syncRail("segThreshold","thumbThreshold");
  syncRail("exportActions","thumbExport");

  const wrap=document.getElementById("matrixWrap");
  if(!colors.length){ wrap.innerHTML='<div class="empty">Paste the hex codes to build the matrix</div>'; return; }
  const cf = chartFontStack();
  let html='<table class="matrix" id="theTable"><thead><tr><th class="corner"></th>';
  for(const c of colors) html+=`<th class="head"><span class="swatch" style="background:${c}"></span>${c.slice(1)}</th>`;
  html+='</tr></thead><tbody>';
  for(const fg of colors){
    html+=`<tr><th class="head" style="text-align:left"><span class="swatch" style="background:${fg}"></span>${fg.slice(1)}</th>`;
    for(const bg of colors){
      if(fg===bg){ html+='<td class="diag"></td>'; continue; }
      const c=cellData(fg,bg); const dim=c.tier<minTier; const clickable=c.tier<2;
      html+=`<td class="cell" style="background:${bg};color:${fg};opacity:${dim?0.12:1};cursor:${clickable?"pointer":"default"}"
             ${clickable?`data-fg="${fg}" data-bg="${bg}"`:""} title="fg ${fg} on bg ${bg} — ${c.grade}">
             <span class="val" style="font-family:${cf}">${c.value}</span>
             <span class="grade" style="font-family:${cf}">${c.grade}</span>
             <span class="tier" style="background:${gradeColor(c.tier)}"></span></td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  wrap.innerHTML=html;

  wrap.querySelectorAll("td.cell[data-fg]").forEach(td=>{
    td.addEventListener("click",()=>openRepair(td.dataset.fg,td.dataset.bg));
  });
}

/* ---------- Repair modal ---------- */
function openRepair(fg,bg){
  const fgRgb=hexToRgb(fg),bgRgb=hexToRgb(bg); const orig=wcagRatio(fgRgb,bgRgb);
  const fixFg=repair(fgRgb,bgRgb,4.5); const fixBg=repair(bgRgb,fgRgb,4.5);
  const opt=(label,nf,nb,changed)=>{ if(!changed)return ""; const r=wcagRatio(hexToRgb(nf),hexToRgb(nb));
    return `<div class="repairOpt"><div class="lbl">${label}</div>
      <div class="preview" style="background:${nb};color:${nf}">Aa</div>
      <span class="hex">${changed}</span><span class="ratio">${r.toFixed(2)} · AA ✓</span>
      <button class="btn" style="margin-top:6px" onclick="copyHex('${changed}')">Copy hex</button></div>`; };
  const body = (fixFg||fixBg)
    ? `<div class="repairGrid">${opt("Shift foreground",fixFg||fg,bg,fixFg)}${opt("Shift background",fg,fixBg||bg,fixBg)}</div>`
    : `<div class="empty">No nearby lightness shift reaches AA — these hues are too close.</div>`;
  document.getElementById("modalMount").innerHTML = `
    <div class="overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal__head">
          <div><div class="sec__title">Auto-repair · ${orig.toFixed(2)} → 4.5</div></div>
          <button class="close" onclick="closeModal()">✕</button></div>
        <div class="preview" style="background:${bg};color:${fg};width:100%">Current · ${orig.toFixed(2)}</div>
        ${body}
      </div></div>`;
}
function closeModal(e){ if(!e||e.target.classList.contains("overlay")||e.type==="click") document.getElementById("modalMount").innerHTML=""; }
function copyHex(h){ navigator.clipboard.writeText(h); }

/* ---------- Export helpers (from prior ADA) ---------- */
function svgEscape(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function chartFontFace(){
  let famName=null, src=null;
  if(state.chartFont==="__display"){ famName="McCann Headline"; src=window.__mccannSrc||null; }
  else if(fontDataUrl && state.chartFont===fontDataUrl.family){ famName=fontDataUrl.family; src="url('"+fontDataUrl.dataUrl+"') format('"+fontDataUrl.format+"')"; }
  if(!famName||!src) return {css:"", family:null};
  return {css:`@font-face{font-family:'${famName}';src:${src};font-weight:100 900;}`, family:famName};
}

function exportSvg(){
  const colors=parseColors(state.input); if(!colors.length)return;
  const minTier={all:0,AALarge:1,AA:2,AAA:3}[state.threshold];
  const cw=120, ch=70, padL=140, padT=140, gap=2;
  const W=padL+colors.length*cw+20, H=padT+colors.length*ch+20;
  const cf=chartFontStack();
  const face=chartFontFace();
  const std=state.standard==="wcag"?"WCAG 2.2":"APCA";

  let g="";
  g+='<g id="col-headers">';
  colors.forEach((c,j)=>{ const cx=padL+j*cw;
    g+=`<rect x="${cx+cw/2-9}" y="${padT-32}" width="18" height="18" fill="${c}" stroke="#EDEDED"/>`;
    g+=`<text x="${cx+cw/2}" y="${padT-8}" font-family="${cf}" font-size="10" text-anchor="middle" fill="#333">${svgEscape(c)}</text>`;
  });
  g+='</g>';

  colors.forEach((fg,i)=>{ const cy=padT+i*ch;
    g+=`<g id="row-${i+1}-${svgEscape(fg.slice(1))}">`;
    g+=`<rect x="${padL-32}" y="${cy+ch/2-9}" width="18" height="18" fill="${fg}" stroke="#EDEDED"/>`;
    g+=`<text x="${padL-40}" y="${cy+ch/2+4}" font-family="${cf}" font-size="9" text-anchor="end" fill="#333">${svgEscape(fg)}</text>`;
    colors.forEach((bg,j)=>{ const cx=padL+j*cw;
      if(fg===bg){ g+=`<rect x="${cx}" y="${cy}" width="${cw-gap}" height="${ch-gap}" fill="#FFFFFF" stroke="#EDEDED"/>`; return; }
      const c=cellData(fg,bg); const dim=c.tier<minTier?0.12:1;
      g+=`<g opacity="${dim}">`;
      g+=`<rect x="${cx}" y="${cy}" width="${cw-gap}" height="${ch-gap}" fill="${bg}" stroke="#EDEDED"/>`;
      g+=`<text x="${cx+cw/2}" y="${cy+ch/2-2}" font-family="${cf}" font-size="16" font-weight="600" text-anchor="middle" fill="${fg}">${svgEscape(c.value)}</text>`;
      g+=`<text x="${cx+cw/2}" y="${cy+ch/2+16}" font-family="${cf}" font-size="9" font-weight="400" text-anchor="middle" fill="${fg}">${svgEscape(c.grade)}</text>`;
      g+=`<rect x="${cx+cw-14}" y="${cy+6}" width="6" height="6" fill="${gradeColor(c.tier)}"/>`;
      g+=`</g>`;
    });
    g+='</g>';
  });

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs><style>${face.css} text{font-family:Inter,sans-serif}</style></defs>
<rect width="${W}" height="${H}" fill="#FFFFFF"/>
<text x="20" y="34" font-family="${cf}" font-size="20" font-weight="600" fill="#333">ADA by McCANN — ${std}</text>
<text x="20" y="52" font-family="${cf}" font-size="10" fill="#696969">FG rows · BG columns · ${colors.length} colors · ${new Date().toLocaleDateString()}</text>
${g}
</svg>`;
  const blob=new Blob([svg],{type:"image/svg+xml"}); const a=document.createElement("a");
  a.download="ada-by-mccann-matrix.svg"; a.href=URL.createObjectURL(blob); a.click();
}

function exportReport(){
  const colors=parseColors(state.input); if(!colors.length)return;
  let total=0,pass=0,fail=0;
  for(const fg of colors)for(const bg of colors){ if(fg===bg)continue; total++; const c=cellData(fg,bg); if(c.tier>=2)pass++; else if(c.tier===0)fail++; }
  const std=state.standard==="wcag"?"WCAG 2.2":"APCA (WCAG 3 candidate)";
  let rows="";
  for(const fg of colors){ rows+=`<tr><th style="text-align:left;padding:6px 10px;white-space:nowrap;font-family:Inter,sans-serif;font-size:11px;border:1px solid #EDEDED"><span style="display:inline-block;width:12px;height:12px;background:${fg};border:1px solid #EDEDED;vertical-align:middle;border-radius:1px"></span> ${fg}</th>`;
    for(const bg of colors){ if(fg===bg){rows+='<td style="background:#fff;border:1px solid #EDEDED"></td>';continue;}
      const c=cellData(fg,bg);
      rows+=`<td style="background:${bg};color:${fg};text-align:center;padding:8px;font-family:Inter,sans-serif;min-width:64px;border:1px solid #EDEDED;position:relative">
        <div style="font-weight:600;font-size:13px">${c.value}</div>
        <div style="font-size:9px">${c.grade}</div>
        <span style="position:absolute;top:4px;right:4px;width:5px;height:5px;background:${gradeColor(c.tier)};border-radius:1px"></span></td>`; }
    rows+="</tr>"; }
  let head='<th style="background:#F7F7F7;color:#333;padding:10px;font-family:Inter,sans-serif;font-size:10px;border:1px solid #EDEDED">FG ↓ / BG →</th>';
  for(const c of colors) head+=`<th style="padding:8px;font-family:Inter,sans-serif;font-size:10px;background:#fff;border:1px solid #EDEDED"><span style="display:inline-block;width:12px;height:12px;background:${c};border:1px solid #EDEDED;border-radius:1px"></span><br>${c}</th>`;
  const report=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Contrast Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"></head>
  <body style="font-family:Inter,sans-serif;color:#333;background:#fff;padding:40px;margin:0">
  <h1 style="font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-0.02em">ADA by McCANN</h1>
  <p style="font-size:13px;color:#696969">Standard: ${std} · ${colors.length} colors · ${total} pairings · ${new Date().toLocaleString()}</p>
  <div style="display:flex;gap:24px;margin:18px 0 28px;font-size:18px;font-weight:400;color:#696969;max-width:480px;flex-direction:column">
    <div style="display:flex;justify-content:space-between;border-bottom:1px solid #EDEDED;padding:6px 0"><span>Pass</span><span>${pass}</span></div>
    <div style="display:flex;justify-content:space-between;border-bottom:1px solid #EDEDED;padding:6px 0"><span>Large only</span><span>${total-pass-fail}</span></div>
    <div style="display:flex;justify-content:space-between;border-bottom:1px solid #EDEDED;padding:6px 0"><span>Fail</span><span>${fail}</span></div>
    <div style="display:flex;justify-content:space-between;border-bottom:1px solid #EDEDED;padding:6px 0;font-weight:600;color:#333"><span style="font-weight:400;color:#696969">Usable</span><span>${Math.round(pass/total*100)}%</span></div>
  </div>
  <div style="overflow-x:auto;border:2px solid #EDEDED;border-radius:5px">
  <table style="border-collapse:collapse;width:100%"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </body></html>`;
  const blob=new Blob([report],{type:"text/html"}); const a=document.createElement("a");
  a.download="contrast-report.html"; a.href=URL.createObjectURL(blob); a.click();
}

function runExport(){
  if(state.exportKind==="html") exportReport();
  else exportSvg();
}

function captureMccannSrc(){
  try{
    for(const sheet of document.styleSheets){
      let rules; try{ rules=sheet.cssRules; }catch(e){ continue; }
      if(!rules) continue;
      for(const rule of rules){
        if(rule.type===CSSRule.FONT_FACE_RULE && /McCann Headline/.test(rule.cssText)){
          const m=rule.cssText.match(/src:\s*([^;]+);/i);
          if(m && /base64/.test(m[1])) window.__mccannSrc=m[1].trim();
        }
      }
    }
  }catch(e){}
}

function injectFontFace(family, dataUrl, format){
  const id="dynFontFace";
  let el=document.getElementById(id);
  if(!el){ el=document.createElement("style"); el.id=id; document.head.appendChild(el); }
  el.textContent=`@font-face{font-family:'${family}';src:url('${dataUrl}') format('${format}');font-weight:100 900;font-display:swap;}`;
}

function closeFontMenu(){
  document.getElementById("fontMenu").classList.remove("is-open");
  document.getElementById("fontChip").setAttribute("aria-expanded","false");
}

function boot(){
  captureMccannSrc();
  document.getElementById("input").value=state.input;
  document.getElementById("input").addEventListener("input",e=>{state.input=e.target.value;render();});

  document.getElementById("segStandard").addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||!b.dataset.v) return;
    state.standard=b.dataset.v; setActive("segStandard",b); render();
  });
  document.getElementById("segThreshold").addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||!b.dataset.v) return;
    state.threshold=b.dataset.v; setActive("segThreshold",b); render();
  });

  document.getElementById("exportActions").addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||!b.dataset.exp) return;
    state.exportKind=b.dataset.exp; setActive("exportActions",b); syncRail("exportActions","thumbExport");
    runExport();
  });

  const chip=document.getElementById("fontChip");
  const menu=document.getElementById("fontMenu");
  chip.addEventListener("click",e=>{
    e.stopPropagation();
    const open=!menu.classList.contains("is-open");
    menu.classList.toggle("is-open", open);
    chip.setAttribute("aria-expanded", open?"true":"false");
  });
  document.addEventListener("click",()=>closeFontMenu());
  menu.addEventListener("click",e=>{
    e.stopPropagation();
    const b=e.target.closest(".opt"); if(!b) return;
    setActive("fontMenu",b);
    state.chartFont=b.dataset.font;
    document.getElementById("fontHint").textContent="";
    closeFontMenu();
    render();
  });

  document.getElementById("fontUploadBtn").addEventListener("click",()=>document.getElementById("fontFile").click());
  document.getElementById("fontFile").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const ext=f.name.split(".").pop().toLowerCase();
    const fmt={ttf:"truetype",otf:"opentype",woff:"woff","woff2":"woff2"}[ext]||"truetype";
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      const family=f.name.replace(/\.[^.]+$/,"").replace(/[^a-zA-Z0-9 _-]/g,"")||"Custom Font";
      fontDataUrl={family,dataUrl,format:fmt};
      injectFontFace(family,dataUrl,fmt);
      state.chartFont=family;
      document.getElementById("fontHint").textContent="Embedded "+family+". Travels inside the SVG.";
      render();
    };
    reader.readAsDataURL(f);
  });
  window.addEventListener("resize",()=>{
    syncRail("segStandard","thumbStandard");
    syncRail("segThreshold","thumbThreshold");
    syncRail("exportActions","thumbExport");
  });

  render();
}

window.addEventListener("DOMContentLoaded",boot);


</script>
</body>
</html>
