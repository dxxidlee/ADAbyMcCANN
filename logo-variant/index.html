<html lang="en">

<meta charset="UTF-8">

<title>Logo-variant — McCann Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Logo-variant — suite language (same rules as Multi-export) */
.vl{
  --vl-fs:var(--suite-fs);
  --vl-track:-1px;
  --vl-label:#969696;
  --vl-chip:#757575;
  --vl-fill:#F4F4F4;
  --vl-radius:5px;
  --vl-stage-radius:10px;
  --vl-stage-stroke:2px solid var(--vl-fill);
  --guide:var(--vl-fill);
  display:contents;
}

.vl__title,
.vl__band,
.vl__desc,
.vl__stage,
.vl__canvas{
  font-family:var(--sans);
  font-size:var(--vl-fs);
  font-weight:400;
  letter-spacing:var(--vl-track);
  line-height:1.2;
  color:#000;
}

.vl__title{
  grid-column:1;
  grid-row:2;
  margin:0;
  padding:0;
  font-family:var(--sans);
  font-size:var(--vl-fs);
  font-weight:400;
  letter-spacing:var(--vl-track);
  line-height:1.2;
  color:#000000;
  white-space:nowrap;
  align-self:start;
  z-index:2;
}

.vl__band{
  grid-column:2 / -1;
  grid-row:2;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
  align-self:start;
  z-index:2;
}

.vl__desc{
  margin:0;
  padding:0;
  font-size:var(--vl-fs);
  font-weight:400;
  letter-spacing:var(--vl-track);
  line-height:1.2;
  color:var(--vl-label);
  flex:0 0 auto;
}

.vl__controls{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  grid-template-rows:auto;
  column-gap:var(--suite-gutter);
  row-gap:15px;
  align-items:start;
  flex:0 0 auto;
  min-height:0;
}

.vl__group{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}
.vl__group--note{ grid-column:1; grid-row:1; }
.vl__group--size{ grid-column:2; grid-row:1; }
.vl__group--export{ grid-column:3; grid-row:1; }

.vl__label{
  margin:0;
  color:var(--vl-label);
  font:inherit;
  letter-spacing:inherit;
  line-height:1.2;
}

.vl__note{
  margin:0;
  color:var(--vl-label);
  font:inherit;
  letter-spacing:inherit;
  line-height:1.35;
  max-width:28em;
}

.vl__pills{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:34px;
}

.vl__pill{
  appearance:none;
  border:0;
  margin:0;
  padding:5px 10px;
  height:34px;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font:inherit;
  letter-spacing:inherit;
  line-height:1;
  color:var(--vl-chip);
  background:transparent;
  border-radius:var(--vl-radius);
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.vl__pill:hover{ color:#000; }
.vl__pill.is-active{
  background:var(--vl-fill);
  color:var(--vl-chip);
}
.vl__pill.is-active:hover{ color:#000; }
.vl__pill:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.vl__status{
  margin:0;
  color:var(--vl-label);
  min-height:1.2em;
}

.vl__stage{
  grid-column:2 / -1;
  grid-row:3 / -1;
  display:flex;
  flex-direction:column;
  gap:var(--suite-gutter);
  min-width:0;
  min-height:0;
  align-self:stretch;
  justify-self:stretch;
  z-index:1;
}

.vl__source-head{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  column-gap:var(--suite-gutter);
  align-items:center;
  flex:0 0 auto;
  min-width:0;
  min-height:34px;
}
.vl__source-head .vl__label{ grid-column:1; align-self:center; }
.vl__meta{
  grid-column:2 / -1;
  display:none;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-width:0;
}
.vl__meta.is-on{ display:flex; }

.vl__tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:34px;
  padding:5px 10px;
  box-sizing:border-box;
  background:var(--vl-fill);
  border-radius:var(--vl-radius);
  color:var(--vl-chip);
  font:inherit;
  letter-spacing:inherit;
  line-height:1;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:0;
  transform:translateY(6px);
  will-change:opacity, transform;
}
.vl__meta.is-on .vl__tag{
  animation:vlTagIn 520ms var(--ease) forwards;
}
.vl__meta.is-on .vl__tag:nth-child(1){ animation-delay:60ms; }
.vl__meta.is-on .vl__tag:nth-child(2){ animation-delay:180ms; }
.vl__meta.is-on .vl__tag:nth-child(3){ animation-delay:300ms; }

@keyframes vlTagIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion:reduce){
  .vl__tag{ opacity:1; transform:none; will-change:auto; }
  .vl__meta.is-on .vl__tag{ animation:none; }
}

.vl__canvas{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  background:transparent;
  border:var(--vl-stage-stroke);
  border-radius:var(--vl-stage-radius);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:text;
  overflow:hidden;
  padding:clamp(16px, 2vw, 36px);
  box-sizing:border-box;
}

.lockup{
  position:relative;
  width:min(100%,720px);
  margin:0 auto;
}
.preview-wrap{ position:relative; width:100%; line-height:0; }
.preview-svg{
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
}
.line2-hit{
  position:absolute;
  left:0; right:0;
  top:var(--hit-top,62%);
  height:var(--hit-h,24%);
  margin:0; padding:0;
  border:0; outline:none;
  background:transparent;
  color:transparent;
  caret-color:var(--vl-label);
  text-align:center;
  text-transform:uppercase;
  font-size:var(--vl-fs);
  line-height:1;
  letter-spacing:0;
  /* Keep typed glyphs invisible — SVG paths are the ink; selection must not paint over McCANN */
  -webkit-text-fill-color:transparent;
}
.line2-hit::placeholder{ color:transparent; opacity:0; }
.line2-hit::selection{
  background:transparent;
  color:transparent;
  -webkit-text-fill-color:transparent;
}
.line2-hit::-moz-selection{
  background:transparent;
  color:transparent;
}
.line2-hit:focus-visible{ outline:2px solid var(--guide); outline-offset:2px; }

.guides{
  position:absolute; inset:0; pointer-events:none;
  opacity:0; transition:opacity .18s var(--ease);
}
.lockup:focus-within .guides{ opacity:1; }
@media (prefers-reduced-motion:reduce){ .guides{ transition:none; } }

.guide-h{
  position:absolute; left:4%; right:4%;
  border-top:1px solid var(--guide);
}
.g-cap{ top:var(--guide-cap,62%); }
.g-base{ top:var(--guide-base,88%); }
.guide-v{
  position:absolute; top:0; bottom:0; left:50%;
  border-left:1px solid var(--guide);
}
</style>
</head>
<body>

<div class="vl">
  <h1 class="vl__title">Logo-variant</h1>

  <div class="vl__band">
    <p class="vl__desc">This tool builds a McCann lockup with a custom second line typed on the preview.</p>

    <div class="vl__controls">
      <div class="vl__group vl__group--note">
        <div class="vl__label">Parameter</div>
        <p class="vl__note">Second line at 55% cap height with +10 tracking, exporting with clear space and outlined paths.</p>
      </div>

      <div class="vl__group vl__group--size">
        <div class="vl__label">File width</div>
        <div class="vl__pills" id="pngOpts" role="radiogroup" aria-label="File width">
          <button type="button" class="vl__pill" data-png="2000" aria-pressed="false">2000 px</button>
          <button type="button" class="vl__pill is-active" data-png="4000" aria-pressed="true">4000 px</button>
          <button type="button" class="vl__pill" data-png="8000" aria-pressed="false">8000 px</button>
        </div>
      </div>

      <div class="vl__group vl__group--export">
        <div class="vl__label">Export</div>
        <div class="vl__pills">
          <button type="button" class="vl__pill is-active" id="dlSvg" disabled>.svg</button>
          <button type="button" class="vl__pill is-active" id="dlPng" disabled>.png</button>
        </div>
        <p class="vl__status" id="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div class="vl__stage">
    <div class="vl__source-head">
      <p class="vl__label">Lockup</p>
      <div class="vl__meta" id="meta" aria-live="polite">
        <span class="vl__tag" id="metaName"></span>
        <span class="vl__tag" id="metaPct">55%</span>
        <span class="vl__tag" id="metaTrack">+10</span>
      </div>
    </div>
    <div class="vl__canvas" id="stage">
      <div class="lockup" id="lockup">
        <div class="preview-wrap">
          <svg class="preview-svg" id="previewSvg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="#000">
              <path id="pathL1"></path>
              <path id="pathL2"></path>
              <path id="pathPh" fill="#969696"></path>
            </g>
          </svg>
          <input class="line2-hit" id="office" type="text"
                 autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40" autofocus
                 aria-label="Office name">
        </div>
        <div class="guides" aria-hidden="true">
          <div class="guide-h g-cap"></div>
          <div class="guide-h g-base"></div>
          <div class="guide-v"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  // ---- geometry (font units, UPM 1000, cap height 700) ----
  var F1 = 1000;
  var F2 = 550;
  var CAP = 0.7;
  var GAP = 52;
  var TRACK2 = 10;
  var BASE1 = F1 * CAP;
  var BASE2 = BASE1 + GAP + F2 * CAP;
  var PAD = 176 * (F1 / 1000);

  var font = null;
  var input = document.getElementById('office');
  var lockup = document.getElementById('lockup');
  var previewSvg = document.getElementById('previewSvg');
  var pathL1 = document.getElementById('pathL1');
  var pathL2 = document.getElementById('pathL2');
  var pathPh = document.getElementById('pathPh');
  var dlSvg = document.getElementById('dlSvg');
  var dlPng = document.getElementById('dlPng');
  var statusEl = document.getElementById('status');
  var metaEl = document.getElementById('meta');
  var metaName = document.getElementById('metaName');
  var pngSize = 4000;
  var CAP2_TOP = BASE1 + GAP;
  var PREVIEW_PAD = 80;

  try {
    var bin = atob(FONT_B64);
    var buf = new ArrayBuffer(bin.length);
    var view = new Uint8Array(buf);
    for (var i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    font = opentype.parse(buf);
  } catch (e) {
    console.error('Font parse failed:', e);
  }

  document.querySelectorAll('#pngOpts .vl__pill').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#pngOpts .vl__pill').forEach(function (x) {
        x.classList.remove('is-active');
        x.setAttribute('aria-pressed', 'false');
      });
      b.classList.add('is-active');
      b.setAttribute('aria-pressed', 'true');
      pngSize = parseInt(b.getAttribute('data-png'), 10) || 4000;
    });
  });

  function layout(text, fontSize, tracking, baselineY) {
    var scale = fontSize / font.unitsPerEm;
    var trackUnits = (tracking / 1000) * fontSize;
    var glyphs = font.stringToGlyphs(text);
    var x = 0, d = '';
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      var p = g.getPath(x, baselineY, fontSize);
      var pd = p.toPathData(2);
      if (pd) d += pd;
      x += (g.advanceWidth || 0) * scale;
      if (i < glyphs.length - 1) {
        x += font.getKerningValue(g, glyphs[i + 1]) * scale;
        x += trackUnits;
      }
    }
    return { d: d, width: x };
  }

  function buildExport(officeName) {
    var l1 = layout('McCANN', F1, 0, BASE1);
    var l2 = layout(officeName, F2, TRACK2, BASE2);
    var x1 = -l1.width / 2;
    var x2 = -l2.width / 2;

    var svgNS = 'http://www.w3.org/2000/svg';
    var tmp = document.createElementNS(svgNS, 'svg');
    var g = document.createElementNS(svgNS, 'g');
    var p1 = document.createElementNS(svgNS, 'path');
    p1.setAttribute('d', l1.d);
    p1.setAttribute('transform', 'translate(' + x1 + ' 0)');
    var p2 = document.createElementNS(svgNS, 'path');
    p2.setAttribute('d', l2.d);
    p2.setAttribute('transform', 'translate(' + x2 + ' 0)');
    g.appendChild(p1); g.appendChild(p2);
    tmp.appendChild(g);
    tmp.style.position = 'absolute';
    tmp.style.visibility = 'hidden';
    document.body.appendChild(tmp);
    var bb = g.getBBox();
    document.body.removeChild(tmp);

    return { l1: l1, l2: l2, x1: x1, x2: x2, bb: bb };
  }

  function previewViewBox(l1w, l2w) {
    var inkW = Math.max(l1w, l2w);
    var vx = -inkW / 2 - PREVIEW_PAD;
    var vy = -PREVIEW_PAD;
    var vw = inkW + PREVIEW_PAD * 2;
    var vh = BASE2 + PREVIEW_PAD * 2;
    return { vx: vx, vy: vy, vw: vw, vh: vh };
  }

  function updatePreview() {
    if (!font) return;
    var name = currentName();
    var l1 = layout('McCANN', F1, 0, BASE1);
    var x1 = -l1.width / 2;
    pathL1.setAttribute('d', l1.d);
    pathL1.setAttribute('transform', 'translate(' + round2(x1) + ' 0)');

    var l2w = 0;
    if (name) {
      var l2 = layout(name, F2, TRACK2, BASE2);
      var x2 = -l2.width / 2;
      l2w = l2.width;
      pathL2.setAttribute('d', l2.d);
      pathL2.setAttribute('transform', 'translate(' + round2(x2) + ' 0)');
      pathL2.style.display = '';
      pathPh.style.display = 'none';
    } else {
      var ph = layout('OFFICE NAME', F2, TRACK2, BASE2);
      var xPh = -ph.width / 2;
      l2w = ph.width;
      pathPh.setAttribute('d', ph.d);
      pathPh.setAttribute('transform', 'translate(' + round2(xPh) + ' 0)');
      pathPh.style.display = '';
      pathL2.style.display = 'none';
    }

    var box = previewViewBox(l1.width, l2w);
    previewSvg.setAttribute('viewBox',
      round2(box.vx) + ' ' + round2(box.vy) + ' ' + round2(box.vw) + ' ' + round2(box.vh));

    var capPct = ((CAP2_TOP - box.vy) / box.vh) * 100;
    var basePct = ((BASE2 - box.vy) / box.vh) * 100;
    lockup.style.setProperty('--guide-cap', capPct + '%');
    lockup.style.setProperty('--guide-base', basePct + '%');
    lockup.style.setProperty('--hit-top', capPct + '%');
    lockup.style.setProperty('--hit-h', (basePct - capPct) + '%');
  }

  function exportBox(e) {
    return {
      x: e.bb.x - PAD,
      y: -PAD,
      w: e.bb.width + 2 * PAD,
      h: BASE2 + 2 * PAD
    };
  }

  function svgString(officeName) {
    var e = buildExport(officeName);
    var box = exportBox(e);
    var w = round2(box.w), h = round2(box.h);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
      round2(box.x) + ' ' + round2(box.y) + ' ' + w + ' ' + h +
      '" width="' + w + '" height="' + h + '">\n' +
      '  <g fill="#000000">\n' +
      '    <path transform="translate(' + round2(e.x1) + ' 0)" d="' + e.l1.d + '"/>\n' +
      '    <path transform="translate(' + round2(e.x2) + ' 0)" d="' + e.l2.d + '"/>\n' +
      '  </g>\n' +
      '</svg>\n';
  }

  function round2(n) { return Math.round(n * 100) / 100; }

  function fileName(officeName, ext) {
    var slug = officeName.trim().toUpperCase().replace(/\s+/g, '-').replace(/[^A-Z0-9\-]/g, '');
    return 'McCANN-' + (slug || 'OFFICE') + '.' + ext;
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function currentName() {
    return input.value.trim().toUpperCase();
  }

  function showMeta(name) {
    if (!name) {
      metaEl.classList.remove('is-on');
      metaName.textContent = '';
      return;
    }
    var wasOn = metaEl.classList.contains('is-on');
    metaName.textContent = name;
    metaName.title = name;
    if (!wasOn) {
      void metaEl.offsetWidth;
      metaEl.classList.add('is-on');
    }
  }

  dlSvg.addEventListener('click', function () {
    if (!font || !currentName()) return;
    var s = svgString(currentName());
    download(new Blob([s], { type: 'image/svg+xml' }), fileName(currentName(), 'svg'));
    statusEl.textContent = 'Downloaded ' + fileName(currentName(), 'svg');
  });

  dlPng.addEventListener('click', function () {
    if (!font || !currentName()) return;
    var e = buildExport(currentName());
    var box = exportBox(e);
    var targetW = pngSize;
    var scale = targetW / box.w;
    var canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = Math.ceil(box.h * scale);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, -box.x * scale, -box.y * scale);
    ctx.fillStyle = '#000';
    ctx.translate(e.x1, 0);
    ctx.fill(new Path2D(e.l1.d));
    ctx.setTransform(scale, 0, 0, scale, -box.x * scale, -box.y * scale);
    ctx.translate(e.x2, 0);
    ctx.fill(new Path2D(e.l2.d));
    canvas.toBlob(function (blob) {
      if (blob) {
        download(blob, fileName(currentName(), 'png'));
        statusEl.textContent = 'Downloaded ' + fileName(currentName(), 'png');
      }
    }, 'image/png');
  });

  function refresh() {
    var ok = !!font && currentName().length > 0;
    dlSvg.disabled = !ok;
    dlPng.disabled = !ok;
    showMeta(currentName());
    if (!ok) statusEl.textContent = '';
    updatePreview();
  }
  input.addEventListener('input', refresh);
  window.addEventListener('resize', updatePreview);
  refresh();

  document.getElementById('stage').addEventListener('mousedown', function (ev) {
    if (ev.target === this || ev.target.id === 'lockup' || ev.target.id === 'previewSvg') {
      ev.preventDefault();
      input.focus();
    }
  });
})();
