<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Mood-strip</title>
<style>
  /* ======================================================================
     Mood-strip — McCANN Creative Suite design system
     Inter only · single type size (12.5px) · soft gray · hairline rules
     Token names mirror assets/design.css so the two stay in step.
     ====================================================================== */
  @font-face{
    font-family:'Inter';
    font-style:normal;
    font-weight:400 600;
    font-display:swap;
    src:url('fonts/inter-latin.woff2') format('woff2');
  }

  :root{
    --bg:#FFFFFF;
    --ink:#333333;
    --muted:#696969;
    --stroke:#EDEDED;
    --line:#EDEDED;
    --surface:#EDEDED;
    --thumb:#696969;

    /* Signal palette (shared with the accessibility matrix) */
    --aaa:#0FB800;
    --aalg:#FFD400;
    --fail:#FF0004;

    --sans:'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --fs:12.5px;
    /* Suite header type — matches the "McCann Design" bar in the Creative Suite */
    --suite-fs:15px;
    --menu-track:-1px;
    --radius:2.5px;
    --radius-pill:3.75px;
    --chip-h:22.5px;
    --hair:1px solid var(--stroke);
    --scroll:#D8D8D8;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:var(--fs);
    font-weight:400;
    line-height:1.25;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  ::selection{background:var(--ink);color:var(--bg)}
  :focus-visible{outline:1px solid var(--ink);outline-offset:2px}

  /* ---------- APP SHELL ---------- */
  #app{
    width:100%;
    height:100%;
    max-width:100vw;
    max-height:100vh;
    margin:0 auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- TITLE BAR ---------- */
  #bar{
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:7px;
    background:var(--bg);
    user-select:none;
    cursor:default;
  }
  #bar .name{
    font-size:var(--suite-fs);
    font-weight:400;
    color:#000000;
    letter-spacing:var(--menu-track);
  }
  #bar .count{
    font-size:var(--fs);
    color:var(--muted);
    margin-left:auto;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- TOOLBAR ---------- */
  #tools{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:center;
    padding:10px 20px;
    background:var(--bg);
  }
  /* Chips, per the Multi-export frame: gray fill, dark label, one weight —
     colour carries the hierarchy rather than boldness. */
  .tool{
    display:inline-flex;
    align-items:center;
    height:var(--chip-h);
    padding:0 7px;
    background:var(--surface);
    border:0;
    border-radius:var(--radius);
    font-family:var(--sans);
    font-size:var(--fs);
    font-weight:400;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
    width:max-content;
    transition:filter .15s var(--ease);
  }
  .tool:hover{filter:brightness(.97)}
  .tool:active{filter:brightness(.94)}

  /* ---------- STRIP ---------- */
  #strip{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
    scrollbar-width:thin;
    scrollbar-color:var(--scroll) transparent;
  }
  #strip::-webkit-scrollbar{width:7.5px}
  #strip::-webkit-scrollbar-track{background:transparent}
  #strip::-webkit-scrollbar-thumb{
    background:var(--scroll);
    border-radius:var(--radius-pill);
  }

  /* ---------- EMPTY STATE ---------- */
  /* Drop zone treatment from the "Source logo" area of the frame:
     hairline border, generous radius, centred muted copy, no icon. */
  #empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    color:var(--muted);
    text-align:center;
    padding:30px 20px;
    border:var(--hair);
    border-radius:var(--radius);
    background:var(--bg);
  }
  #empty p{font-size:var(--fs);line-height:1.6;color:var(--muted)}
  #empty b{color:var(--ink);font-weight:400}

  /* ---------- CARD ---------- */
  .card{
    border:var(--hair);
    border-radius:var(--radius);
    background:var(--bg);
    position:relative;
    flex:0 0 auto;
    overflow:hidden;
  }
  .card.dragging{opacity:.35}
  .card.drop-above{box-shadow:0 -2px 0 var(--ink)}
  .card.drop-below{box-shadow:0 2px 0 var(--ink)}

  .card-img{
    display:block;
    width:100%;
    height:auto;
    cursor:grab;
    user-select:none;
    -webkit-user-drag:none;
  }
  .card-img:active{cursor:grabbing}

  .card-bar{
    height:28px;
    display:flex;
    align-items:center;
    gap:3px;
    padding:0 5px 0 9px;
    border-top:var(--hair);
    background:var(--bg);
  }
  .card-label{
    font-size:var(--fs);
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
  }
  .card-dim{
    font-size:var(--fs);
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    flex:0 0 auto;
    padding-right:5px;
    white-space:nowrap;
  }
  .card-dim.low{color:var(--ink);font-weight:400}
  .card-dim.low::before{
    content:"";
    display:inline-block;
    width:3px;height:3px;
    border-radius:.5px;
    background:var(--aalg);
    margin-right:4px;
    vertical-align:middle;
  }

  .lowres{
    display:none;
    border-top:var(--hair);
    background:var(--surface);
    padding:8px 9px;
    font-size:var(--fs);
    line-height:1.45;
    color:var(--muted);
  }
  .lowres.show{display:block}
  .lowres b{color:var(--ink);font-weight:400}
  .lowres .fix{
    margin-top:7px;
    display:inline-flex;
    align-items:center;
    height:var(--chip-h);
    padding:0 7px;
    background:var(--bg);
    border:0;
    border-radius:var(--radius);
    font-family:var(--sans);
    font-size:var(--fs);
    font-weight:400;
    color:var(--ink);
    cursor:pointer;
    line-height:1;
    transition:filter .15s var(--ease);
  }
  .lowres .fix:hover{filter:brightness(.97)}

  .icon-btn{
    width:22px;height:20px;
    background:none;border:none;
    color:var(--muted);
    cursor:pointer;
    display:grid;place-items:center;
    border-radius:var(--radius);
    flex:0 0 auto;
    transition:color .15s var(--ease),background .15s var(--ease);
  }
  .icon-btn:hover{color:var(--ink);background:var(--surface)}
  .icon-btn.on{color:var(--ink)}
  .icon-btn svg{width:12px;height:12px;display:block}

  /* ---------- PALETTE ---------- */
  .palette{
    display:none;
    border-top:var(--hair);
    padding:9px;
    background:var(--bg);
  }
  .palette.open{display:block}
  .sw-row{display:flex;gap:5px}
  .sw{
    flex:1;
    height:34px;
    border:var(--hair);
    cursor:pointer;
    position:relative;
    border-radius:var(--radius);
  }
  .sw-hexes{
    display:flex;gap:5px;margin-top:6px;
  }
  .sw-hex{
    flex:1;
    font-size:var(--fs);
    font-weight:400;
    color:var(--muted);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
  }
  .pal-actions{margin-top:9px;display:flex;gap:5px}
  .mini{
    flex:1;
    height:var(--chip-h);
    background:var(--surface);
    border:0;
    color:var(--ink);
    font-family:var(--sans);
    font-size:var(--fs);
    font-weight:400;
    line-height:1;
    cursor:pointer;
    border-radius:var(--radius);
    transition:filter .15s var(--ease);
  }
  .mini:hover{filter:brightness(.97)}

  /* ---------- FLOATING POP-OUT ---------- */
  .float{
    position:fixed;
    border:var(--hair);
    border-radius:var(--radius);
    background:var(--bg);
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    z-index:100;
    display:flex;
    flex-direction:column;
    min-width:130px;
    min-height:110px;
    overflow:hidden;
  }
  .float-head{
    height:26px;
    flex:0 0 26px;
    display:flex;
    align-items:center;
    gap:3px;
    padding:0 4px 0 9px;
    background:var(--bg);
    border-bottom:var(--hair);
    cursor:move;
    user-select:none;
  }
  .float-title{
    font-size:var(--fs);color:var(--muted);
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .float-body{
    flex:1;
    overflow:hidden;
    display:grid;
    place-items:center;
    /* Light checkerboard so transparent PNGs read on a white ground */
    background:
      linear-gradient(45deg,var(--surface) 25%,transparent 25%,transparent 75%,var(--surface) 75%),
      linear-gradient(45deg,var(--surface) 25%,var(--bg) 25%,var(--bg) 75%,var(--surface) 75%);
    background-size:14px 14px;
    background-position:0 0,7px 7px;
  }
  .float-body img{
    max-width:100%;max-height:100%;
    display:block;
    -webkit-user-drag:none;user-select:none;
  }
  .float-foot{
    height:28px;flex:0 0 28px;
    display:flex;align-items:center;gap:7px;
    padding:0 9px;
    border-top:var(--hair);
    background:var(--bg);
  }
  .float-foot label{
    font-size:var(--fs);color:var(--muted);flex:0 0 auto;
  }
  /* Rail proportions from the suite: 7.5px track, gray thumb */
  .float-foot input[type=range]{
    flex:1;
    -webkit-appearance:none;appearance:none;
    height:3px;background:var(--surface);border-radius:var(--radius-pill);
    cursor:pointer;min-width:0;
  }
  .float-foot input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:9px;height:9px;border-radius:50%;
    background:var(--thumb);cursor:pointer;
  }
  .float-foot input[type=range]::-moz-range-thumb{
    width:9px;height:9px;border-radius:50%;border:none;
    background:var(--thumb);cursor:pointer;
  }
  .float-pct{
    font-size:var(--fs);color:var(--muted);flex:0 0 30px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .float-grip{
    position:absolute;right:0;bottom:0;
    width:14px;height:14px;
    cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 50%,var(--scroll) 50%,var(--scroll) 62%,transparent 62%,transparent 74%,var(--scroll) 74%,var(--scroll) 86%,transparent 86%);
  }

  /* ---------- DROP OVERLAY ---------- */
  #drop{
    position:absolute;inset:0;
    background:rgba(255,255,255,.78);
    border:1px dashed var(--ink);
    display:none;
    place-items:center;
    z-index:200;
    pointer-events:none;
  }
  #drop.on{display:grid}
  #drop span{
    font-size:var(--fs);font-weight:400;color:var(--ink);
  }

  /* ---------- TOAST ---------- */
  #toast{
    position:absolute;
    bottom:14px;left:50%;
    transform:translate(-50%,14px);
    background:var(--ink);
    color:var(--bg);
    font-size:var(--fs);font-weight:400;
    padding:6px 12px;border-radius:var(--radius);
    opacity:0;pointer-events:none;
    transition:opacity .16s var(--ease),transform .16s var(--ease);
    z-index:300;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <div class="name">Mood-strip</div>
    <div class="count" id="count">0 refs</div>
  </div>

  <div id="tools">
    <button class="tool" id="btn-add">Add images</button>
    <button class="tool" id="btn-link">Paste link</button>
    <button class="tool" id="btn-float">Float</button>
    <button class="tool" id="btn-clear">Clear</button>
  </div>

  <div id="strip">
    <div id="empty">
      <p>
        Drop images here, or press <b>⌘V</b><br>
        <br>
        Pinterest, Tumblr and Shopify links<br>
        upgrade to full size on their own.<br>
        <br>
        On <b>Google Images</b>, click the thumbnail first<br>
        and drag from the large preview.<br>
        The grid only holds a small copy.
      </p>
    </div>
  </div>

  <div id="drop"><span>Drop to add</span></div>
  <div id="toast"></div>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden>

<script>
(function(){
"use strict";

const $ = s => document.querySelector(s);
const strip = $("#strip");
const empty = $("#empty");
const app   = $("#app");
const drop  = $("#drop");
const toastEl = $("#toast");
const fileInput = $("#file-input");

let refs = [];      // {id,name,src,palette,palOpen}
let seq  = 0;
let toastTimer = null;

/* ============ ICONS ============ */
const ICON = {
  palette:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="9.5" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>',
  popout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  save:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v11"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>',
  del:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16"/><path d="M9 6V4h6v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
  close:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ============ TOAST ============ */
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove("on"), 1500);
}

/* ============ COLOR EXTRACTION (median cut) ============ */
function extractPalette(img, n){
  n = n || 5;
  const MAX = 120;
  const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth  * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));

  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, w, h);

  let data;
  try { data = ctx.getImageData(0,0,w,h).data; }
  catch(e){ return null; }   // tainted canvas (cross-origin)

  const px = [];
  for(let i=0;i<data.length;i+=4){
    if(data[i+3] < 125) continue;
    px.push([data[i], data[i+1], data[i+2]]);
  }
  if(!px.length) return null;

  // median cut
  let boxes = [px];
  while(boxes.length < n){
    boxes.sort((a,b)=>range(b)-range(a));
    const box = boxes.shift();
    if(!box || box.length < 2){ if(box) boxes.push(box); break; }
    const ch = widestChannel(box);
    box.sort((a,b)=>a[ch]-b[ch]);
    const mid = box.length >> 1;
    boxes.push(box.slice(0,mid), box.slice(mid));
  }

  return boxes
    .filter(b => b && b.length)
    .map(avg)
    .sort((a,b)=>lum(b)-lum(a))
    .slice(0,n)
    .map(rgbToHex);

  function widestChannel(b){
    let best=0,bestR=-1;
    for(let c=0;c<3;c++){
      let lo=255,hi=0;
      for(const p of b){ if(p[c]<lo)lo=p[c]; if(p[c]>hi)hi=p[c]; }
      if(hi-lo>bestR){bestR=hi-lo;best=c;}
    }
    return best;
  }
  function range(b){
    if(!b || !b.length) return -1;
    let m=0;
    for(let c=0;c<3;c++){
      let lo=255,hi=0;
      for(const p of b){ if(p[c]<lo)lo=p[c]; if(p[c]>hi)hi=p[c]; }
      if(hi-lo>m)m=hi-lo;
    }
    return m;
  }
  function avg(b){
    let r=0,g=0,bl=0;
    for(const p of b){ r+=p[0]; g+=p[1]; bl+=p[2]; }
    return [Math.round(r/b.length), Math.round(g/b.length), Math.round(bl/b.length)];
  }
  function lum(c){ return .2126*c[0] + .7152*c[1] + .0722*c[2]; }
  function rgbToHex(c){
    return "#" + c.map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
  }
}

/* ============ URL UPGRADING ============
   Most sites serve a downscaled thumbnail in the grid and keep the
   original at a predictable path. Rewrite to the original when we
   recognise the pattern. Returns the best URL we can guess.        */
function upgradeUrl(url){
  let u = url;

  try{
    // Pinterest: /236x/ /474x/ /564x/ /736x/ -> /originals/
    if(/pinimg\.com/i.test(u)){
      u = u.replace(/\/\d+x\d*\//, "/originals/");
    }

    // Tumblr: _250 _400 _500 -> _1280
    else if(/tumblr\.com/i.test(u)){
      u = u.replace(/_(75|100|250|400|500|540|640)\.(jpe?g|png|gif)/i, "_1280.$2");
    }

    // WordPress / Squarespace style: name-300x200.jpg -> name.jpg
    else if(/-\d{2,4}x\d{2,4}\.(jpe?g|png|webp)/i.test(u)){
      u = u.replace(/-\d{2,4}x\d{2,4}(\.(jpe?g|png|webp))/i, "$1");
    }

    // Squarespace format param
    else if(/squarespace-cdn\.com/i.test(u)){
      u = u.replace(/\?format=\d+w/i, "?format=2500w");
    }

    // Shopify: _small _medium _large _1024x1024 -> original
    else if(/cdn\.shopify\.com/i.test(u)){
      u = u.replace(/_(pico|icon|thumb|small|compact|medium|large|grande|\d+x\d*)(\.(jpe?g|png|webp))/i, "$2");
    }

    // Behance
    else if(/mir-s3-cdn-cf\.behance\.net/i.test(u)){
      u = u.replace(/\/projects\/\d+\//, "/projects/original/");
    }

    // Unsplash: force full width
    else if(/images\.unsplash\.com/i.test(u)){
      u = u.replace(/([?&])w=\d+/i, "$1w=2400");
    }

    // Wikimedia: /thumb/a/ab/File.jpg/300px-File.jpg -> /a/ab/File.jpg
    else if(/wikimedia\.org.*\/thumb\//i.test(u)){
      u = u.replace(/\/thumb\//, "/").replace(/\/\d+px-[^/]+$/, "");
    }
  }catch(err){ return url; }

  return u;
}

/* Is this URL a known dead-end thumbnail we cannot upgrade? */
function isHardThumb(url){
  return /encrypted-tbn\d?\.gstatic\.com/i.test(url)   // Google Images grid
      || /^data:image\/(gif|png);base64,R0lGOD/i.test(url); // 1px placeholder
}

/* Try upgraded URL first, silently fall back to the original if it 404s. */
function resolveBest(rawUrl, done){
  const up = upgradeUrl(rawUrl);
  if(up === rawUrl){ done(rawUrl, false); return; }

  const test = new Image();
  let settled = false;
  const finish = (src, upgraded) => {
    if(settled) return;
    settled = true;
    done(src, upgraded);
  };

  test.onload  = () => finish(up, true);
  test.onerror = () => finish(rawUrl, false);
  setTimeout(() => finish(rawUrl, false), 6000);
  test.src = up;
}

/* ============ ADD REFS ============ */
function addFile(file){
  if(!file || !file.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = e => addRef(file.name || "image", e.target.result);
  r.readAsDataURL(file);
}

function addUrl(url){
  url = (url||"").trim();
  if(!url) return;
  const name = (url.split("/").pop() || "image").split("?")[0].slice(0,42) || "image";

  if(isHardThumb(url)){
    // Google grid thumbnail. Nothing to upgrade to.
    addRef(name, url, {hardThumb:true, origin:url});
    return;
  }

  resolveBest(url, (best, upgraded) => {
    addRef(name, best, {origin:url, upgraded:upgraded});
    if(upgraded) toast("Upgraded to full size");
  });
}

function addRef(name, src, meta){
  meta = meta || {};
  refs.push({
    id:"r"+(++seq),
    name, src,
    palette:null,
    palOpen:false,
    origin:meta.origin || null,
    upgraded:!!meta.upgraded,
    hardThumb:!!meta.hardThumb
  });
  render();
  requestAnimationFrame(()=>{ strip.scrollTop = strip.scrollHeight; });
}

/* ============ RENDER ============ */
function render(){
  $("#count").textContent = refs.length + (refs.length===1 ? " ref" : " refs");

  strip.innerHTML = "";
  if(!refs.length){ strip.appendChild(empty); persist(); return; }

  refs.forEach((ref, idx) => strip.appendChild(buildCard(ref, idx)));
  persist();
}

function buildCard(ref, idx){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = ref.id;
  card.draggable = true;

  /* image */
  const img = document.createElement("img");
  img.className = "card-img";
  img.src = ref.src;
  img.alt = ref.name;
  img.crossOrigin = "anonymous";
  img.addEventListener("error", () => {
    if(img.crossOrigin){ img.crossOrigin = null; img.src = ref.src; }
  }, {once:true});
  card.appendChild(img);

  /* bar */
  const bar = document.createElement("div");
  bar.className = "card-bar";

  const label = document.createElement("div");
  label.className = "card-label";
  label.textContent = String(idx+1).padStart(2,"0") + "  " + ref.name;
  bar.appendChild(label);

  /* live pixel dimensions */
  const dim = document.createElement("div");
  dim.className = "card-dim";
  dim.textContent = "···";
  bar.appendChild(dim);

  /* low-res warning strip */
  const warn = document.createElement("div");
  warn.className = "lowres";

  const showDims = () => {
    const w = img.naturalWidth, h = img.naturalHeight;
    if(!w) return;
    dim.textContent = w + " × " + h;
    const small = Math.max(w,h) < 800;
    dim.classList.toggle("low", small);
    dim.title = small ? "Low resolution source" : "Full resolution";

    if(small){
      warn.classList.add("show");
      warn.innerHTML = "";
      const msg = document.createElement("div");
      msg.innerHTML = ref.hardThumb
        ? "<b>Thumbnail from a search grid.</b> Google serves a small preview here, not the real file. Open the image on its own page and drag it from there."
        : "<b>Low resolution source.</b> The site handed over a preview file. Try opening the image directly and dragging that.";
      warn.appendChild(msg);

      if(ref.origin){
        const btn = document.createElement("button");
        btn.className = "fix";
        btn.textContent = "Open source";
        btn.addEventListener("click", () => window.open(ref.origin, "_blank", "noopener"));
        warn.appendChild(btn);
      }
    }
  };

  if(img.complete && img.naturalWidth) showDims();
  else img.addEventListener("load", showDims);

  bar.appendChild(iconBtn(ICON.palette, "Colors", ref.palOpen, () => togglePalette(ref, card, img)));
  bar.appendChild(iconBtn(ICON.popout,  "Pop out", false, () => popOut(ref)));
  bar.appendChild(iconBtn(ICON.save,    "Save",    false, () => saveRef(ref)));
  bar.appendChild(iconBtn(ICON.del,     "Remove",  false, () => removeRef(ref.id)));

  card.appendChild(bar);
  card.appendChild(warn);

  /* palette */
  const pal = document.createElement("div");
  pal.className = "palette" + (ref.palOpen ? " open" : "");
  card.appendChild(pal);
  if(ref.palOpen) fillPalette(pal, ref, img);

  wireDrag(card, ref);
  return card;
}

function iconBtn(svg, title, active, fn){
  const b = document.createElement("button");
  b.className = "icon-btn" + (active ? " on" : "");
  b.innerHTML = svg;
  b.title = title;
  b.setAttribute("aria-label", title);
  b.addEventListener("click", e => { e.stopPropagation(); fn(); });
  b.addEventListener("dragstart", e => e.preventDefault());
  return b;
}

/* ============ PALETTE UI ============ */
function togglePalette(ref, card, img){
  ref.palOpen = !ref.palOpen;
  const pal = card.querySelector(".palette");
  const btn = card.querySelector(".icon-btn");
  pal.classList.toggle("open", ref.palOpen);
  btn.classList.toggle("on", ref.palOpen);
  if(ref.palOpen) fillPalette(pal, ref, img);
}

function fillPalette(pal, ref, img){
  const build = () => {
    if(!ref.palette) ref.palette = extractPalette(img, 5);

    if(!ref.palette){
      pal.innerHTML = '<div style="font-size:9.5px;color:var(--text-dim);letter-spacing:.05em;line-height:1.7">'
        + "This image is served from another site and blocks color reading.<br>"
        + "Save it, then drop the file back in."
        + "</div>";
      return;
    }

    pal.innerHTML = "";

    const row = document.createElement("div");
    row.className = "sw-row";
    const hexes = document.createElement("div");
    hexes.className = "sw-hexes";

    ref.palette.forEach(hex => {
      const sw = document.createElement("button");
      sw.className = "sw";
      sw.style.background = hex;
      sw.title = "Copy " + hex;
      sw.setAttribute("aria-label", "Copy " + hex);
      sw.addEventListener("click", () => copy(hex, hex + " copied"));
      row.appendChild(sw);

      const h = document.createElement("div");
      h.className = "sw-hex";
      h.textContent = hex.replace("#","");
      hexes.appendChild(h);
    });

    pal.appendChild(row);
    pal.appendChild(hexes);

    const acts = document.createElement("div");
    acts.className = "pal-actions";

    const all = document.createElement("button");
    all.className = "mini";
    all.textContent = "Copy all";
    all.addEventListener("click", () => copy(ref.palette.join("\n"), "5 hex codes copied"));
    acts.appendChild(all);

    const css = document.createElement("button");
    css.className = "mini";
    css.textContent = "Copy as CSS";
    css.addEventListener("click", () => {
      const txt = ref.palette.map((h,i)=>"  --color-"+(i+1)+": "+h+";").join("\n");
      copy(":root {\n"+txt+"\n}", "CSS copied");
    });
    acts.appendChild(css);

    pal.appendChild(acts);
  };

  if(img.complete && img.naturalWidth) build();
  else img.addEventListener("load", build, {once:true});
}

function copy(text, msg){
  navigator.clipboard.writeText(text).then(
    () => toast(msg),
    () => {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
      toast(msg);
    }
  );
}

/* ============ SAVE / REMOVE ============ */
function saveRef(ref){
  const a = document.createElement("a");
  a.href = ref.src;
  a.download = ref.name.includes(".") ? ref.name : ref.name + ".png";
  document.body.appendChild(a); a.click(); a.remove();
}

function removeRef(id){
  refs = refs.filter(r => r.id !== id);
  render();
}

/* ============ POP-OUT FLOATING CARD ============ */
/* Pop out into a real OS window so it can be dragged anywhere on screen and
   float over other apps (including their fullscreen Spaces), instead of being
   a div clipped to this window. Falls back to the in-app float when running in
   a plain browser with no Tauri host. */
let popoutSeq = 0;
function popOut(ref){
  const T = window.__TAURI__;
  if(!T){ popOutWeb(ref); return; }

  const label = "popout-" + (++popoutSeq) + "-" + Date.now().toString(36);
  const n = popoutSeq - 1;

  // Hand the image over once the new window says it is listening.
  const unlisten = T.event.listen("popout-ready", e => {
    if(!e.payload || e.payload.label !== label) return;
    T.event.emit("popout-data-" + label, { src: ref.src, name: ref.name });
    Promise.resolve(unlisten).then(f => typeof f === "function" && f());
  });

  const w = new T.webviewWindow.WebviewWindow(label, {
    url: "popout.html?label=" + encodeURIComponent(label),
    title: ref.name,
    width: 320,
    height: 380,
    minWidth: 160,
    minHeight: 140,
    x: Math.max(0, Math.min((window.screenX||0) + (window.outerWidth||500) + 14 + n*22,
                            (screen.availWidth||1440) - 340)),
    y: Math.max(0, Math.min((window.screenY||0) + 40 + n*22,
                            (screen.availHeight||900) - 400)),
    resizable: true,
    decorations: true,
    alwaysOnTop: true,
    visible: false,
    dragDropEnabled: false
  });

  w.once("tauri://created", () => {
    // Convert to a floating panel and reveal it (see make_overlay in lib.rs).
    T.core.invoke("make_overlay", { label });
  });
  w.once("tauri://error", err => {
    console.error("pop-out failed, falling back to inline float:", err);
    popOutInline(ref);
  });
}

/* Pop out in the hosted build: a real, separate browser window. Unlike Document
   PiP (one at a time) you can have as many of these as you like and drag them
   anywhere on screen, including onto a second display. They are ordinary windows
   though — not always-on-top — so each one carries a Float chip that promotes its
   image into a PiP window when you need it above Photoshop. */
let webPopSeq = 0;
const webPops = new Set();

function popOutWeb(ref){
  const w = window.open(
    "", "moodstrip-pop-" + (++webPopSeq),
    "width=340,height=430,menubar=no,toolbar=no,location=no,status=no"
  );
  if(!w){                       // popup blocker — fall back to the in-page float
    toast("Allow pop-ups to open windows");
    popOutInline(ref);
    return;
  }
  webPops.add(w);
  buildPopout(w, ref);
  w.addEventListener("pagehide", () => webPops.delete(w));
}

/* Builds the pop-out UI into any window — kept separate from window.open so the
   markup can be exercised against a test document. */
function buildPopout(w, ref){
  const d = w.document;
  d.title = ref.name || "Mood-strip";
  copyStylesInto(d);            // reuse the app's stylesheet so it matches exactly

  const base = d.createElement("style");
  base.textContent =
    "html,body{height:100%}" +
    "body{margin:0;display:flex;flex-direction:column;background:var(--bg);" +
    "font-family:var(--sans);font-size:var(--fs);color:var(--ink)}";
  d.head.appendChild(base);

  const body = d.createElement("div");
  body.className = "float-body";
  const img = d.createElement("img");
  img.src = ref.src;
  img.alt = ref.name || "";
  body.appendChild(img);

  const foot = d.createElement("div");
  foot.className = "float-foot";

  const dims = d.createElement("div");
  dims.style.cssText =
    "color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums";
  const setDims = () => {
    if(img.naturalWidth) dims.textContent = img.naturalWidth + "×" + img.naturalHeight;
  };
  img.addEventListener("load", setDims);
  setDims();
  foot.appendChild(dims);

  let actual = false;
  const zoom = d.createElement("button");
  zoom.className = "tool";
  zoom.textContent = "1:1";
  zoom.title = "Toggle actual pixel size";
  zoom.addEventListener("click", () => {
    actual = !actual;
    body.style.placeItems = actual ? "start" : "center";
    body.style.overflow   = actual ? "auto"  : "hidden";
    img.style.maxWidth    = actual ? "none"  : "100%";
    img.style.maxHeight   = actual ? "none"  : "100%";
    img.style.width       = actual ? img.naturalWidth + "px" : "";
  });
  foot.appendChild(zoom);

  if("documentPictureInPicture" in w){
    const fl = d.createElement("button");
    fl.className = "tool";
    fl.textContent = "Float";
    fl.title = "Keep this reference above other apps";
    fl.addEventListener("click", async () => {
      try{
        const p = await w.documentPictureInPicture.requestWindow({width:320, height:400});
        copyStylesInto(p.document, d);
        p.document.title = ref.name || "Mood-strip";
        p.document.body.style.cssText =
          "margin:0;height:100%;display:grid;place-items:center;background:var(--bg)";
        const pi = p.document.createElement("img");
        pi.src = ref.src;
        pi.style.cssText = "max-width:100%;max-height:100%;display:block";
        p.document.body.appendChild(pi);
      }catch(err){
        // Only one PiP window is available at a time; if it is already in use
        // this throws and the pop-out simply stays an ordinary window.
        fl.textContent = "Float unavailable";
        setTimeout(() => { fl.textContent = "Float"; }, 1600);
      }
    });
    foot.appendChild(fl);
  }

  const lab = d.createElement("label");
  lab.textContent = "Opacity";
  const rng = d.createElement("input");
  rng.type = "range"; rng.min = "15"; rng.max = "100"; rng.value = "100";
  const pct = d.createElement("div");
  pct.className = "float-pct";
  pct.textContent = "100%";
  rng.addEventListener("input", () => {
    // Dims the image against the window's own background — a browser window
    // cannot be made translucent to the desktop the way the native app is.
    body.style.opacity = rng.value / 100;
    pct.textContent = rng.value + "%";
  });
  foot.appendChild(lab); foot.appendChild(rng); foot.appendChild(pct);

  d.body.appendChild(body);
  d.body.appendChild(foot);
}

// Don't leave orphaned windows behind when the tab closes.
window.addEventListener("pagehide", () => {
  webPops.forEach(w => { try{ w.close(); }catch(e){} });
});

function popOutInline(ref){
  const win = document.createElement("div");
  win.className = "float";

  const rect = app.getBoundingClientRect();
  const n = document.querySelectorAll(".float").length;
  win.style.left = Math.min(rect.right + 14 + n*22, window.innerWidth - 300) + "px";
  win.style.top  = (rect.top + 40 + n*22) + "px";
  win.style.width  = "260px";
  win.style.height = "240px";

  /* head */
  const head = document.createElement("div");
  head.className = "float-head";
  const t = document.createElement("div");
  t.className = "float-title";
  t.textContent = ref.name;
  head.appendChild(t);

  const zoom = document.createElement("button");
  zoom.className = "icon-btn";
  zoom.style.width = "auto";
  zoom.style.padding = "0 6px";
  zoom.style.fontSize = "9px";
  zoom.style.letterSpacing = ".06em";
  zoom.textContent = "1:1";
  zoom.title = "Toggle actual pixel size";
  head.appendChild(zoom);
  const x = document.createElement("button");
  x.className = "icon-btn";
  x.innerHTML = ICON.close;
  x.title = "Close";
  x.setAttribute("aria-label","Close");
  x.addEventListener("click", () => win.remove());
  head.appendChild(x);
  win.appendChild(head);

  /* body */
  const body = document.createElement("div");
  body.className = "float-body";
  const im = document.createElement("img");
  im.src = ref.src; im.alt = ref.name;
  body.appendChild(im);
  win.appendChild(body);

  /* foot */
  /* 1:1 toggle: switch between fit-to-window and true pixel size */
  let actual = false;
  zoom.addEventListener("click", () => {
    actual = !actual;
    zoom.classList.toggle("on", actual);
    if(actual){
      body.style.overflow = "auto";
      body.style.placeItems = "start";
      im.style.maxWidth = "none";
      im.style.maxHeight = "none";
      im.style.width = im.naturalWidth + "px";
      im.style.height = "auto";
    }else{
      body.style.overflow = "hidden";
      body.style.placeItems = "center";
      im.style.maxWidth = "100%";
      im.style.maxHeight = "100%";
      im.style.width = "";
      im.style.height = "";
    }
  });

  const foot = document.createElement("div");
  foot.className = "float-foot";

  const dims = document.createElement("div");
  dims.style.cssText = "font-size:9px;color:var(--text-dim);flex:0 0 auto;letter-spacing:.03em";
  const setDims = () => {
    if(im.naturalWidth) dims.textContent = im.naturalWidth + "×" + im.naturalHeight;
  };
  if(im.complete && im.naturalWidth) setDims();
  else im.addEventListener("load", setDims, {once:true});
  foot.appendChild(dims);

  const lab = document.createElement("label");
  lab.textContent = "Opacity";
  const id = "op-" + Math.random().toString(36).slice(2,8);
  lab.htmlFor = id;
  const rng = document.createElement("input");
  rng.type = "range"; rng.min = "15"; rng.max = "100"; rng.value = "100"; rng.id = id;
  const pct = document.createElement("div");
  pct.className = "float-pct";
  pct.textContent = "100%";
  rng.addEventListener("input", () => {
    win.style.opacity = rng.value / 100;
    pct.textContent = rng.value + "%";
  });
  foot.appendChild(lab); foot.appendChild(rng); foot.appendChild(pct);
  win.appendChild(foot);

  /* resize grip */
  const grip = document.createElement("div");
  grip.className = "float-grip";
  win.appendChild(grip);

  document.body.appendChild(win);
  makeDraggable(win, head);
  makeResizable(win, grip);
}

function makeDraggable(el, handle){
  let sx, sy, ox, oy, moving = false;
  handle.addEventListener("pointerdown", e => {
    if(e.target.closest(".icon-btn")) return;
    moving = true;
    sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect();
    ox = r.left; oy = r.top;
    handle.setPointerCapture(e.pointerId);
    el.style.zIndex = ++zTop;
  });
  handle.addEventListener("pointermove", e => {
    if(!moving) return;
    el.style.left = (ox + e.clientX - sx) + "px";
    el.style.top  = (oy + e.clientY - sy) + "px";
  });
  handle.addEventListener("pointerup", e => {
    moving = false;
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  });
}

let zTop = 100;

function makeResizable(el, grip){
  let sx, sy, sw, sh, sizing = false;
  grip.addEventListener("pointerdown", e => {
    sizing = true;
    sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect();
    sw = r.width; sh = r.height;
    grip.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  grip.addEventListener("pointermove", e => {
    if(!sizing) return;
    el.style.width  = Math.max(130, sw + e.clientX - sx) + "px";
    el.style.height = Math.max(110, sh + e.clientY - sy) + "px";
  });
  grip.addEventListener("pointerup", e => {
    sizing = false;
    try{ grip.releasePointerCapture(e.pointerId); }catch(err){}
  });
}

/* ============ REORDER BY DRAG ============ */
let dragId = null;

function wireDrag(card, ref){
  card.addEventListener("dragstart", e => {
    dragId = ref.id;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", ref.id); }catch(err){}
  });
  card.addEventListener("dragend", () => {
    dragId = null;
    card.classList.remove("dragging");
    document.querySelectorAll(".card").forEach(c =>
      c.classList.remove("drop-above","drop-below"));
  });
  card.addEventListener("dragover", e => {
    if(!dragId || dragId === ref.id) return;
    e.preventDefault();
    e.stopPropagation();
    const r = card.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    card.classList.toggle("drop-above", above);
    card.classList.toggle("drop-below", !above);
  });
  card.addEventListener("dragleave", () => {
    card.classList.remove("drop-above","drop-below");
  });
  card.addEventListener("drop", e => {
    if(!dragId || dragId === ref.id) return;
    e.preventDefault();
    e.stopPropagation();
    const r = card.getBoundingClientRect();
    const above = e.clientY < r.top + r.height/2;
    const from = refs.findIndex(x => x.id === dragId);
    if(from < 0) return;
    const moved = refs.splice(from,1)[0];
    let to = refs.findIndex(x => x.id === ref.id);
    if(!above) to++;
    refs.splice(to, 0, moved);
    dragId = null;
    render();
  });
}

/* ============ DROP FROM OUTSIDE ============ */
let dragDepth = 0;

app.addEventListener("dragenter", e => {
  if(dragId) return;
  dragDepth++;
  drop.classList.add("on");
});
app.addEventListener("dragover", e => {
  e.preventDefault();
  if(!dragId) e.dataTransfer.dropEffect = "copy";
});
app.addEventListener("dragleave", e => {
  if(dragId) return;
  dragDepth--;
  if(dragDepth <= 0){ dragDepth = 0; drop.classList.remove("on"); }
});
app.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove("on");
  if(dragId) return;

  const dt = e.dataTransfer;

  if(dt.files && dt.files.length){
    Array.from(dt.files).forEach(addFile);
    return;
  }

  const html = dt.getData("text/html");
  if(html){
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if(m){ addUrl(m[1]); return; }
  }

  const uri = dt.getData("text/uri-list") || dt.getData("text/plain");
  if(uri) addUrl(uri);
});

/* ============ PASTE ============ */
window.addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if(items){
    for(const it of items){
      if(it.type.startsWith("image/")){
        addFile(it.getAsFile());
        return;
      }
    }
  }
  const txt = e.clipboardData && e.clipboardData.getData("text");
  if(txt && /^https?:\/\//i.test(txt.trim())) addUrl(txt);
});

$("#btn-add").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  Array.from(fileInput.files).forEach(addFile);
  fileInput.value = "";
});

$("#btn-link").addEventListener("click", () => {
  const u = prompt("Image link");
  if(u) addUrl(u);
});

$("#btn-clear").addEventListener("click", () => {
  if(!refs.length) return;
  if(confirm("Remove all " + refs.length + " references?")){
    refs = [];
    render();
  }
});

/* ============ FLOAT (browser build) ============
   Document Picture-in-Picture is the only web API that yields a real
   always-on-top OS window, so it is how the hosted build floats over
   Photoshop. Chromium only — the button hides itself elsewhere.
   The live #strip element is moved across rather than mirrored, so every
   existing listener (drag-reorder, palette, delete) keeps working. */
const PIP_OK = "documentPictureInPicture" in window;
const floatBtn = $("#btn-float");
let pipWin = null, stripHome = null;

if(!PIP_OK || window.__TAURI__) floatBtn.style.display = "none";

function copyStylesInto(doc, from){
  (from || document).querySelectorAll("style").forEach(s => {
    const el = doc.createElement("style");
    el.textContent = s.textContent;
    doc.head.appendChild(el);
  });
}

async function floatStrip(){
  if(pipWin){ pipWin.focus(); return; }
  let w;
  try{
    w = await documentPictureInPicture.requestWindow({width:340, height:720});
  }catch(err){
    toast("Could not open floating window");
    return;
  }
  pipWin = w;

  copyStylesInto(w.document);
  w.document.title = "Mood-strip";
  w.document.body.style.cssText =
    "margin:0;height:100%;display:flex;flex-direction:column;background:#fff";

  stripHome = document.createElement("div");
  stripHome.style.cssText =
    "flex:1;display:grid;place-items:center;text-align:center;padding:30px 20px;color:var(--muted)";
  stripHome.textContent = "Strip is floating.";
  strip.replaceWith(stripHome);
  w.document.body.appendChild(strip);

  floatBtn.textContent = "Return strip";

  w.addEventListener("pagehide", () => {
    if(stripHome){ stripHome.replaceWith(strip); stripHome = null; }
    pipWin = null;
    floatBtn.textContent = "Float";
  });
}

floatBtn.addEventListener("click", () => {
  if(pipWin) pipWin.close(); else floatStrip();
});

/* ============ PERSISTENCE (browser build) ============
   A tab gets closed and reloaded far more often than an app window, so the
   board is kept in IndexedDB. Data URLs are far too large for localStorage. */
const DB = "moodstrip", STORE = "kv";
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function idbSet(k, v){
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(v, k);
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  }));
}
function idbGet(k){
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readonly");
    const q = tx.objectStore(STORE).get(k);
    q.onsuccess = () => res(q.result);
    q.onerror   = () => rej(q.error);
  }));
}

let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    const slim = refs.map(r => ({
      id:r.id, name:r.name, src:r.src,
      origin:r.origin, upgraded:r.upgraded, hardThumb:r.hardThumb
    }));
    idbSet("refs", slim).catch(() => {});
  }, 400);
}

idbGet("refs").then(saved => {
  if(Array.isArray(saved) && saved.length){
    refs = saved.map(r => Object.assign({}, r, {palette:null, palOpen:false}));
    // Keep new ids from colliding with restored ones
    seq = refs.reduce((m, r) => Math.max(m, parseInt(String(r.id).slice(1), 10) || 0), 0);
    render();
  }
}).catch(() => {});

render();
})();
</script>
